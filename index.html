<!doctype html>

    <script>
      window.onerror=function(m,s,l,c,e){fetch("/api/client-error",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,source:s,lineno:l,colno:c,error:e?e.stack:""})})};
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
        });
      }
    </script>
