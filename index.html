<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var lastErrTime = 0;
        window.onerror = function(m, s, l, c, e) {
          var now = Date.now();
          if (now - lastErrTime < 10000) return;
          lastErrTime = now;
          try {
            fetch("/api/client-error", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: m, source: s, lineno: l, colno: c, error: e ? e.stack : "" })
            }).catch(function() {});
          } catch(err) {}
        };

        // Fallback watchdog if JS fails to execute or root stays empty
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML = '<div style="min-height: 100vh; background: #0c0e15; color: #ff549a; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;">' +
              '<h2 style="font-size: 20px; margin-bottom: 12px; letter-spacing: 2px;">PREDICTIONS RUNNER</h2>' +
              '<p style="color: #e6e0ff; font-size: 13px; max-width: 480px; margin-bottom: 20px;">Interface is syncing or recovering from cached state.</p>' +
              '<button onclick="if(window.caches) { caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); window.location.reload(true); }); } else { window.location.reload(true); }" style="background: #ff549a; color: white; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: monospace; letter-spacing: 1px;">Reload & Clear Cache</button>' +
              '</div>';
          }
        }, 4000);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0e15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PredictionsRunner.exe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <title>PredictionsRunner.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="Autonomous cryptocurrency trading bot powered by Gemini and Coinbase Advanced Trade." />
    <meta property="og:title" content="PredictionsRunner.exe" />
    <meta property="og:description" content="Autonomous cryptocurrency trading bot powered by Gemini and Coinbase Advanced Trade." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
