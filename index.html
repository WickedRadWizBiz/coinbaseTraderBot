<!doctype html>
<html lang="en" style="background-color: #05040a; color: #e6e0ff; margin: 0; min-height: 100vh;">
  <head>
    <script>
      (function() {
        var lastErrTime = 0;
        window.onerror = function(m, s, l, c, e) {
          var now = Date.now();
          if (now - lastErrTime < 10000) return;
          lastErrTime = now;
          try {
            fetch("/api/client-error", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: m, source: s, lineno: l, colno: c, error: e ? e.stack : "" })
            }).catch(function() {});
          } catch(err) {}
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05040a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PredictionsRunner.exe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <title>PredictionsRunner.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <meta name="description" content="Autonomous cryptocurrency trading bot powered by Gemini and Coinbase Advanced Trade." />
    <meta property="og:title" content="PredictionsRunner.exe" />
    <meta property="og:description" content="Autonomous cryptocurrency trading bot powered by Gemini and Coinbase Advanced Trade." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background: #05040a !important;
        color: #e6e0ff;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      .initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #110d24 0%, #05040a 100%);
        color: #9b7cff;
        font-family: monospace;
      }
      .loader-bar {
        width: 140px;
        height: 3px;
        background: rgba(155, 124, 255, 0.2);
        margin-top: 16px;
        position: relative;
        overflow: hidden;
        border-radius: 2px;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: 40%;
        background: #ff549a;
        animation: loader-anim 1.2s infinite ease-in-out;
      }
      @keyframes loader-anim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body style="background-color: #05040a; color: #e6e0ff; margin: 0; min-height: 100vh;">
    <div id="root">
      <div class="initial-loader">
        <div style="font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #ff549a; text-transform: uppercase;">PREDICTIONS RUNNER</div>
        <div style="font-size: 11px; opacity: 0.6; margin-top: 4px; letter-spacing: 1px;">INITIALIZING SECURE TRADING INTERFACE...</div>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
