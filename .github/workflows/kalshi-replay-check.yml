# Kalshi replay check (step 1 of the plan the owner approved on Oct 24): does the backtester trade like the paper bot?
# research/replayCheck.ts replays the bot's own recordings with the server's settings and sets the result next to the
# audit log over the stretch since the bot's last start (each deploy restarts it, so that stretch ran one version of
# the code), up to now (the day being recorded is copied too, gzipped on the way at low priority) or the `to` input.
#
# Its own concurrency group, so it never waits behind a sweep run. Read-only on the server, except the verdict, which
# goes next to the sweep's proposal (data/models/sweeps/replay-check-latest.json), where the sweep's report reads it.
# This repository is public: the job prints counts, $ totals and setting names, never the settings file, keys or logs.
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Kalshi replay check

on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of audit log to read, comma separated (empty = yesterday and today so far)'
        required: false
        default: ''
      from:
        description: 'Start of the compared stretch (ISO time, or auto = the paper bot''s last start)'
        required: false
        default: 'auto'
      to:
        description: 'End of the compared stretch (ISO time, or now): an earlier end checks a stretch the bot has since restarted after'
        required: false
        default: 'now'
      min_hours:
        description: 'Shortest stretch that gets a verdict (hours)'
        required: false
        default: '3'
      nearby:
        description: 'Bankrolls (x paper''s) the stretch is also replayed at, space separated; the verdict holds their median to paper (none = only paper''s)'
        required: false
        default: '0.95 0.975 1.025 1.05'
      phases:
        description: 'Where in each second the nearby replays evaluate (ms), one for each nearby bankroll in order: paper''s 1 s timer can fall anywhere in the second (the check''s own replay evaluates at 0)'
        required: false
        default: '200 400 600 800'
      skip_models:
        description: 'Model files the paper bot did not have in the stretch, left out of the replay, space separated (any of vol_profile.json vol_model.json fill_model.json rule_book.json gp_indicators.json): one promoted since then would otherwise price the whole stretch'
        required: false
        default: ''
      pnl_test:
        description: 'How the verdict judges P&L: luck (paper within 2 standard deviations of the replays, summed over the stretches checked) or pct (the replays'' median within 25% of paper''s)'
        required: false
        default: 'luck'
      overrides:
        description: 'Replay-only settings, KEY=VALUE space separated (e.g. EXIT_POLICY=hold): the replay runs with them against what paper actually did, and the verdict is not copied to the server'
        required: false
        default: ''
  push:
    branches: ['claude/kalshi-random-sweep']
    paths: ['.github/workflows/kalshi-replay-check.yml', 'research/replayCheck.ts', 'research/backtest.ts', 'research/seedCandles.ts']

permissions:
  # Write for the one step that posts the replay's summary on the commit (a comment); everything else reads.
  contents: write

concurrency:
  # Comparison runs (overrides set) each get their own group, so several exit policies replay side by side; a fidelity
  # check keeps the shared group and never runs beside another.
  group: kalshi-replay-check${{ inputs.overrides && format('-{0}-{1}', inputs.overrides, inputs.from) || '' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the audit log, the recordings the stretch needs, the model and the settings (read-only)
        env:
          CHECK_DAYS: ${{ inputs.days || '' }}
          CHECK_FROM: ${{ inputs.from || 'auto' }}
          CHECK_TO: ${{ inputs.to || 'now' }}
          SKIP_MODELS: ${{ inputs.skip_models || '' }}
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/audit" "$DATA/models" "$DATA/sweep-env" "$DATA/sweeps"
          for f in $SKIP_MODELS; do [[ "$f" =~ ^(vol_profile|vol_model|fill_model|rule_book|gp_indicators)\.json$ ]] || { echo "skip_models: $f is not one of the model files the check copies"; exit 1; }; done
          # A model file left out (skip_models): one the paper bot did not have yet in the stretch.
          wanted() { case " $SKIP_MODELS " in *" $1 "*) echo "$1 left out (skip_models)"; return 1;; esac; }
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          D=$(echo "${CHECK_DAYS:-$(date -u -d yesterday +%F),$(date -u +%F)}" | tr -d ' ')
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]] || { echo "days must be YYYY-MM-DD[,YYYY-MM-DD...]"; exit 1; }
          echo "$D" > "$DATA/sweeps/check-days.txt"
          # The stretch ends now (the recordings are copied after this), or where the input says.
          TO=$(date -u +%FT%TZ)
          if [ "$CHECK_TO" != now ]; then
            [[ "$CHECK_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$ ]] || { echo "to must be an ISO time like 2026-10-28T03:10:00Z, or now"; exit 1; }
            TO="$CHECK_TO"
          fi
          echo "$TO" > "$DATA/sweeps/check-to.txt"
          PAT=$(echo "$D" | tr ',' '\n' | sed -E "s/^(.+)$/-name 'audit-\1*' -o/" | tr '\n' ' ' | sed -E 's/ -o $//')
          ssh bot "cd ~/bot/data/audit && find . -maxdepth 1 -type f \( $PAT \) -printf '%P\n'" > "$RUNNER_TEMP/audit.txt"
          rsync -a -z --compress-level=1 --rsync-path="nice -n 19 rsync" --files-from="$RUNNER_TEMP/audit.txt" bot:bot/data/audit/ "$DATA/audit/" || vanished_ok
          # The take-profit bench's and the accuracy gate's scoreboards now, read right after the audit log (whose bench
          # events wind the bench back): the replay starts from them as they stood when the stretch began.
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/take-profit-bench.json "$RUNNER_TEMP/paper-tp-bench.json" 2>/dev/null || true
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/accuracy_gate.json "$RUNNER_TEMP/paper-accuracy-gate.json" 2>/dev/null || true
          # The stretches checked before, for the luck test's tally (the verdict adds this one and copies it back).
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/models/sweeps/replay-check-history.json "$DATA/sweeps/" 2>/dev/null || true
          # The paper account's equity at cost now (its cash plus what the contracts it holds cost; cash alone leaves out what
          # open positions tie up): the check backs out what paper settled since the stretch began.
          ssh bot "python3 -" > "$RUNNER_TEMP/paper-balance" 2>/dev/null <<'PY' || rm -f "$RUNNER_TEMP/paper-balance"
          import json, os
          s = json.load(open(os.path.expanduser('~/bot/data/paper_exchange.json')))
          basis, held = s.get('basis') or {}, s.get('positions') or {}
          print(round(s['balance'] + sum((basis.get(t) or {}).get('yesCost', 0) + (basis.get(t) or {}).get('noCost', 0) for t, n in held.items() if n), 4))
          PY
          # The bot's equity guard (the break-even it sizes against, its tier) and the dashboard's kill-switch override (on
          # unless turned off), so the replay sizes and pauses as the bot does.
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/equity_guard.json "$RUNNER_TEMP/paper-guard.json" 2>/dev/null || rm -f "$RUNNER_TEMP/paper-guard.json"
          ssh bot "python3 -c 'import json,os; s=json.load(open(os.path.expanduser(\"~/bot/data/control.json\"))); print(\"false\" if s.get(\"killOverride\") is False else \"true\")'" > "$RUNNER_TEMP/kill-override" 2>/dev/null || echo true > "$RUNNER_TEMP/kill-override"
          # The bot's recent maker fills' 60 s markouts, read as its TCA reloads them (the log's last 4 MB, paper fills of
          # the last 7 days, the newest 2000, maker fills with a 60 s markout): they seed the replay's maker buffer.
          ssh bot "python3 -" > "$RUNNER_TEMP/maker-markouts.json" 2>/dev/null <<'PY' || echo '[]' > "$RUNNER_TEMP/maker-markouts.json"
          import json, os, time
          now = time.time() * 1000
          with open(os.path.expanduser('~/bot/data/tca/tca.jsonl'), 'rb') as fh:
              fh.seek(0, 2); fh.seek(max(0, fh.tell() - 4000000)); text = fh.read().decode('utf8', 'replace')
          recs = []
          for line in text.split('\n'):
              try: r = json.loads(line)
              except Exception: continue
              if isinstance(r, dict) and r.get('mode') == 'paper' and isinstance(r.get('ts'), (int, float)) and now - r['ts'] <= 7 * 86400000 and r.get('markouts'):
                  recs.append(r)
          print(json.dumps([r['markouts']['60s'] for r in recs[-2000:] if not r.get('isTaker') and isinstance(r['markouts'].get('60s'), (int, float))]))
          PY
          NEED=$(node --import tsx research/replayCheck.ts --plan --audit data/audit --days "$D" --from "$CHECK_FROM" --to "$TO")
          [[ "$NEED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]] || { echo "could not work out the stretch"; exit 1; }
          for d in ${NEED//,/ }; do
            f="md-$d.jsonl"
            # A plain file is the day being recorded (or one not compressed yet): gzipped on the way, at low priority
            # (gzip's status 2 is its warning that the file grew while it read it; a torn last line is skipped).
            if ssh bot "test -f ~/bot/data/recordings/$f"; then
              ssh bot "nice -n 19 gzip -1 -c ~/bot/data/recordings/$f; [ \$? -le 2 ]" > "$DATA/recordings/$f.gz"
            elif ssh bot "test -f ~/bot/data/recordings/$f.gz"; then
              # Today's is the bot's live gzip (#172: a member every few seconds): read as it stands, the readers skip a
              # last member still being written. Finished days are copied whole.
              if [ "$d" = "$(date -u +%F)" ]; then ssh bot "nice -n 19 cat ~/bot/data/recordings/$f.gz" > "$DATA/recordings/$f.gz"
              else rsync -a --rsync-path="nice -n 19 rsync" "bot:bot/data/recordings/$f.gz" "$DATA/recordings/" || vanished_ok; fi
            fi
          done
          echo "$(echo "$D,$NEED" | tr ',' '\n' | sort -u | paste -sd, -)" > "$DATA/sweeps/check-days.txt"
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/models/model.json "$DATA/models/" || echo "no trained model on the server: the check uses the identity model"
          # The other models the engine prices with (the vol profile, vol model and fill model), where the server has them;
          # else the shipped params/ files, as the bot picks them.
          for f in vol_profile.json vol_model.json fill_model.json; do wanted "$f" || continue; rsync -a --rsync-path="nice -n 19 rsync" "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || true; done
          # The validation gates' state (which books' unvalidated models are benched).
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/probation.json "$RUNNER_TEMP/paper-probation.json" 2>/dev/null || true
          # The TA network the engine prices with (its promoted copy and the newest archived versions its ensemble blends),
          # the rule book and the evolved formula (both among the signals that order the engine's markets), the component
          # trials' verdicts, and the index series the network's context and the market context read (dominance, the slow
          # indexes, the risk gauges) from the bot's history directory.
          for f in ta_net.json rule_book.json gp_indicators.json; do wanted "$f" || continue; rsync -a --rsync-path="nice -n 19 rsync" "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || true; done
          mkdir -p "$DATA/models/archive/ta_net" "$DATA/history"
          ssh bot 'ls -1 ~/bot/data/models/archive/ta_net/*.json 2>/dev/null | sort -r | head -4' | while read -r f; do rsync -a --rsync-path="nice -n 19 rsync" "bot:$f" "$DATA/models/archive/ta_net/" 2>/dev/null || true; done
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/component_trials.json "$RUNNER_TEMP/paper-trials.json" 2>/dev/null || true
          INC=(--include='/*/'); for a in BTCDOM BTC.D USDT.D TOTAL3 OTHERS.D RTY DXY US10Y VIX HYG; do INC+=("--include=/*/$a/***"); done
          rsync -a --rsync-path="nice -n 19 rsync" --prune-empty-dirs --max-size=50m "${INC[@]}" --exclude='*' bot:bot/data/history/ "$DATA/history/" 2>/dev/null || true
          echo "TA network $([ -f "$DATA/models/ta_net.json" ] && echo "from the server" || echo "shipped") + $(ls "$DATA/models/archive/ta_net" | wc -l) archived; rule book $([ -f "$DATA/models/rule_book.json" ] && echo read || echo 'not read'); trials $([ -s "$RUNNER_TEMP/paper-trials.json" ] && echo read || echo 'not read'); index series $(find "$DATA/history" -name '*.csv' | wc -l) file(s)"
          # The server's settings without any credential line and without server paths (the same filter as Remote training).
          ssh bot "grep -E '^[A-Z][A-Z0-9_]*=' ~/bot/bot.env" | grep -vE 'KEY|SECRET|TOKEN|PASSWORD|PRIVATE|PEM|CREDENTIAL|^BIND_HOST=|^ALLOW_NON_LOOPBACK|^PORT=' | grep -vE '^[A-Z0-9_]+=["'"'"']?(/|~)' > "$DATA/sweep-env/train.env" || true
          echo "audit days $D: $(wc -l < "$RUNNER_TEMP/audit.txt") file(s); recorded days $NEED: $(ls "$DATA/recordings" | wc -l) file(s); settings $(wc -l < "$DATA/sweep-env/train.env") line(s); paper balance $([ -s "$RUNNER_TEMP/paper-balance" ] && echo read || echo 'not read'), equity guard $([ -s "$RUNNER_TEMP/paper-guard.json" ] && echo read || echo 'not read'), override $(cat "$RUNNER_TEMP/kill-override"), maker markouts $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/maker-markouts.json" 2>/dev/null || echo 0)"
          du -sh "$DATA/recordings" | cat
      - name: Replay check (backtester vs paper, since the bot's last start)
        env:
          CHECK_FROM: ${{ inputs.from || 'auto' }}
          MIN_HOURS: ${{ inputs.min_hours || '3' }}
          NEARBY: ${{ inputs.nearby || '0.95 0.975 1.025 1.05' }}
          PHASES: ${{ inputs.phases || '200 400 600 800' }}
          PNL_TEST: ${{ inputs.pnl_test || 'luck' }}
          OVERRIDES: ${{ inputs.overrides || '' }}
        run: |
          set -a; . data/sweep-env/train.env; set +a
          # Replay-only overrides (an exit policy to compare, say) on top of the server's settings; paper's side is what it did.
          for kv in $OVERRIDES; do export "$kv"; echo "replay-only override: $kv"; done
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper
          BAL=$(cat "$RUNNER_TEMP/paper-balance" 2>/dev/null || true)
          GUARD="$RUNNER_TEMP/paper-guard.json"; [ -s "$GUARD" ] || GUARD=""
          OVERRIDE=$(cat "$RUNNER_TEMP/kill-override" 2>/dev/null || echo true)
          ARGS=(--recordings data/recordings --audit data/audit --days "$(cat data/sweeps/check-days.txt)" --from "$CHECK_FROM" --to "$(cat data/sweeps/check-to.txt)"
            --min-hours "$MIN_HOURS" ${BAL:+--paper-balance-now "$BAL"} ${GUARD:+--paper-guard "$GUARD"} --kill-override "$OVERRIDE"
            --maker-markouts "$RUNNER_TEMP/maker-markouts.json" --paper-probation "$RUNNER_TEMP/paper-probation.json" --paper-trials "$RUNNER_TEMP/paper-trials.json"
            --paper-tp-bench "$RUNNER_TEMP/paper-tp-bench.json" --paper-accuracy-gate "$RUNNER_TEMP/paper-accuracy-gate.json" --model data/models/model.json)
          T0=$(date +%s); mkdir -p data/sweeps/nearby; [ "$NEARBY" = none ] && NEARBY=''
          # The spot candles the bot held when the replay starts (its startup fetch from Coinbase, made for that time): a
          # stretch that begins in the middle of a run otherwise replays with only the bars recorded since, too few for the
          # TA network, and prices without its volatility forecast (Oct 27: the fair value 1.5c off paper's).
          node --import tsx research/replayCheck.ts "${ARGS[@]}" --fetch-seed data/sweeps/seed-candles.json || echo "spot candles for the replay's start: not fetched (the recorded ones only)"
          [ -s data/sweeps/seed-candles.json ] && ARGS+=(--seed-candles data/sweeps/seed-candles.json)
          # One replay's P&L is path-sensitive (the same code at a $64 or a $74 bankroll made -$11.63 or -$32.76 over one
          # stretch): the stretch also replays at bankrolls a few percent off paper's, each evaluating at another point of
          # the second (paper's 1 s timer could have fallen anywhere in it), side by side (first in line for the
          # out-of-memory killer, so the check's own replay is the last to go), and the verdict holds their median to paper's.
          read -ra PH <<< "$PHASES"; i=0
          for s in $NEARBY; do
            ph="${PH[$i]:-0}"; i=$((i + 1))
            [[ "$ph" =~ ^[0-9]{1,3}$ ]] || { echo "phases must be whole ms below 1000"; exit 1; }
            choom -n 900 -- timeout 200m node --import tsx research/replayCheck.ts "${ARGS[@]}" --bankroll-scale "$s" --tick-phase-ms "$ph" --out "data/sweeps/nearby/$s.json" > "$RUNNER_TEMP/nearby-$s.log" 2>&1 &
          done
          { timeout 200m node --import tsx research/replayCheck.ts "${ARGS[@]}" --tick-phase-ms 0 --out data/sweeps/replay-check-own.json || echo "replay check failed or cut off"; } 2>&1 | tee "$RUNNER_TEMP/own.log"
          wait
          for s in $NEARBY; do [ -s "data/sweeps/nearby/$s.json" ] || echo "nearby replay x$s did not finish: $(grep -E 'Error|Killed|heap' "$RUNNER_TEMP/nearby-$s.log" | tail -n 1 | cut -c1-160)"; done
          if [ -s data/sweeps/replay-check-own.json ]; then
            # The tally counts only stretches replayed by this same backtester (a hash of its files: a fix starts afresh).
            CODE=$(cat research/backtest.ts research/replay.ts research/callTape.ts research/replayCheck.ts research/seedCandles.ts | sha256sum | cut -c1-8)
            node --import tsx research/replayCheck.ts --combine data/sweeps/replay-check-own.json --nearby "$(ls data/sweeps/nearby/*.json 2>/dev/null | paste -sd, -)" \
              --history data/sweeps/replay-check-history.json --code "$CODE" --pnl-test "$PNL_TEST" --out data/sweeps/replay-check-latest.json 2>&1 | tee -a "$RUNNER_TEMP/own.log"
          fi
          echo "replay check took $(( ($(date +%s) - T0) / 60 )) min; memory now $(free -m | awk '/^Mem:/ {print $3 " MB used of " $2}')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-check
          path: data/sweeps/replay-check-latest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Post the summary on the commit
        # The job log lives on a host the cloud sessions that dispatch comparison runs cannot read, so the summary the
        # check printed (counts, dollars and settings; the same lines as the log) goes on the commit as a comment, where
        # the API serves it. Every manual or push run posts; the daily scheduled run keeps to the log and the server's verdict.
        if: ${{ always() && github.event_name != 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDES: ${{ inputs.overrides || '' }}
          CHECK_FROM: ${{ inputs.from || 'auto' }}
        run: |
          LOG="$RUNNER_TEMP/own.log"; [ -s "$LOG" ] || { echo "no replay output to post"; exit 0; }
          { echo "**Replay check** run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · from $CHECK_FROM${OVERRIDES:+ · replay-only overrides: \`$OVERRIDES\`}"
            echo; echo '```'; cut -c1-600 "$LOG" | head -n 150; echo '```'; } > "$RUNNER_TEMP/comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - --jq '.html_url'
      - name: Copy the verdict to the server
        # A replay with overrides is a comparison, not a fidelity check: it never touches the server's verdict or tally.
        if: ${{ !inputs.overrides }}
        run: |
          [ -f data/sweeps/replay-check-latest.json ] || { echo "no verdict to copy"; exit 0; }
          ssh bot "mkdir -p ~/bot/data/models/sweeps"
          rsync -a data/sweeps/replay-check-latest.json bot:bot/data/models/sweeps/
          [ -s data/sweeps/replay-check-history.json ] && rsync -a data/sweeps/replay-check-history.json bot:bot/data/models/sweeps/
          echo "verdict copied to the server (data/models/sweeps/replay-check-latest.json, and the tally of stretches beside it)"
