name: Exit diagnosis

# Why the ratchet stop and the model exit lose, from the paper bot's own records (read-only): copies deploy/cross_study.py
# from the dispatched ref to the server, runs it over the audit log and the recordings for a window of positions, prints
# the report and posts it on the commit (the job log sits on a host the cloud sessions cannot read). Nothing on the server
# changes; the study prints counts, prices and dollars only.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of positions the study covers, ending at `until` (about a minute of server time an hour)'
        required: false
        default: '24'
      until:
        description: 'End of the window: an ISO UTC time such as 2026-10-28T03:10:00Z, or now'
        required: false
        default: 'now'

permissions:
  # Write for the one step that posts the report on the commit (a comment); everything else reads.
  contents: write

concurrency:
  group: exit-diagnosis-${{ inputs.hours }}-${{ inputs.until }}
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Run the exit study on the server (read-only)
        env:
          HOURS: ${{ inputs.hours || '24' }}
          UNTIL: ${{ inputs.until || 'now' }}
        run: |
          [[ "$HOURS" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "hours must be a number"; exit 1; }
          U=''
          if [ "$UNTIL" != now ]; then
            [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "until must be an ISO UTC time or now"; exit 1; }
            U="$UNTIL"
          fi
          T=$(python3 -c "print(int(float('$HOURS') * 110 + 600))")
          ssh bot "mkdir -p /tmp/diag"
          scp -q deploy/cross_study.py bot:/tmp/diag/cross_study.py
          { ssh bot "timeout $T nice -n 19 python3 /tmp/diag/cross_study.py ~/bot/data $HOURS $U" || echo "(exit study stopped: $?)"; } 2>&1 | tee "$RUNNER_TEMP/report.txt"
      - name: Post the report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ inputs.hours || '24' }}
          UNTIL: ${{ inputs.until || 'now' }}
        run: |
          R="$RUNNER_TEMP/report.txt"; [ -s "$R" ] || { echo "no report to post"; exit 0; }
          { echo "**Exit diagnosis** run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · $HOURS h of positions up to $UNTIL"
            echo; echo '```'; cut -c1-600 "$R" | head -n 400; echo '```'; } > "$RUNNER_TEMP/comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - --jq '.html_url'
