name: Cache probe

# Does a server copy cache (kalshi-server-*) or a Kalshi history cache (kalshi-replay-*) from main exist? Lookup only, no
# download (plus deleting this thread's own stale caches), no server access; posts the matched keys as a commit comment (thread "Plan dynamic scaling", Nov 1).
on:
  push:
    branches: ['claude/project-thread-0pkw7f']
    paths: ['.github/workflows/cache-probe.yml']

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: s
        uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: kalshi-server-none
          restore-keys: kalshi-server-
          lookup-only: true
      - id: r
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: kalshi-replay-none
          restore-keys: kalshi-replay-
          lookup-only: true
      # Free space (10 GB repo limit): drop this thread's caches that no run needs any more (listed here, exact keys only).
      - name: Delete stale caches of this thread
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in scaling-history-replay-41351228092 scaling-history-server-41351228092; do gh cache delete "$k" -R "${{ github.repository }}" && echo "deleted $k" || echo "no cache $k"; done
          gh cache list -R "${{ github.repository }}" -L 100 --json key,sizeInBytes,ref --jq '.[] | "\(.key) \(.ref) \(.sizeInBytes/1e6|floor)MB"' | head -60 > /tmp/caches.txt; cat /tmp/caches.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          S: ${{ steps.s.outputs.cache-matched-key }}
          R: ${{ steps.r.outputs.cache-matched-key }}
        run: |
          BODY="Cache probe: kalshi-server match: '${S:-none}'; kalshi-replay match: '${R:-none}'"
          echo "$BODY"
          BODY="$BODY"$'\n\n```\n'"$(cat /tmp/caches.txt 2>/dev/null)"$'\n```'
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" > /dev/null
