name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # PyTorch (CPU build) for the TA network's torch trainer tests (python/tanet against the TypeScript network).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyTorch (CPU)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, numpy; print('torch', torch.__version__, 'numpy', numpy.__version__)"
      - run: npm test
        env:
          TA_NET_PYTHON: python
      - run: npm run build
