name: Auto Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to Lightsail Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Copy build artifacts to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "dist,package.json,package-lock.json"
          target: "~/${{ secrets.LIGHTSAIL_APP_DIR || 'coinbaseTraderBot' }}"

      - name: Restart PM2 on Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          script: |
            cd ~/${{ secrets.LIGHTSAIL_APP_DIR || 'coinbaseTraderBot' }} || cd ~/coinbaseTraderBot

            echo "=== Installing production dependencies ==="
            npm install --omit=dev

            echo "=== Restarting PM2 process ==="
            pm2 delete crypto-bot 2>/dev/null || true
            pm2 delete coinbaseTraderBot 2>/dev/null || true
            NODE_ENV=production pm2 start dist/server.cjs --name "crypto-bot" --update-env
            pm2 save

            echo "=== Deployment successful and lightning fast! ==="
