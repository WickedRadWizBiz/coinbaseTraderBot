# Manual, reviewed deployment of a TAGGED release. Nothing deploys on push.
# (The previous workflow deployed every push to main straight to the live box
# with `npm install` — the Knight Capital failure mode.)
#
# Requirements:
#  - Run from the Actions tab with the release tag (e.g. v2.0.0).
#  - The `production` GitHub environment should require a reviewer approval.
#  - The server keeps its own .env (TRADING_MODE etc.); this workflow never
#    changes trading mode or credentials.
name: Deploy release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (must already exist, e.g. v2.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (lockfile only), verify, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          echo "${{ inputs.tag }}" > dist/RELEASE

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "dist,web/dist,params,package.json,package-lock.json,deploy"
          target: "~/releases/${{ inputs.tag }}"

      - name: Activate release (keeps previous for rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/releases/${{ inputs.tag }}
            npm ci --omit=dev
            bash deploy/activate.sh ~/releases/${{ inputs.tag }}
