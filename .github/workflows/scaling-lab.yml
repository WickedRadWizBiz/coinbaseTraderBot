# Dynamic-scaling lab (Steven, Oct 31: iterate the dynamic edge, regime sizing and the exit chooser until the bot averages
# $4.50/h, never bench them). One read-only copy off the server per round (the same files as the replay check, at 8 MB/s),
# then every arm in lab/scaling-arms.txt replays the same stretch from the same starting balance on its own runner, with its
# settings as replay-only overrides, so arms compare paired. Each arm posts its summary on the commit (tag in the title).
# Nothing is written to the server. Runs on a push of lab/scaling-arms.txt to the scaling branch.
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Scaling lab

on:
  push:
    branches: ['claude/project-thread-ks5pyx']
    paths: ['lab/scaling-arms.txt']

permissions:
  contents: write
  actions: read

concurrency:
  group: scaling-lab
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.p.outputs.days }}
      from: ${{ steps.p.outputs.from }}
      to: ${{ steps.p.outputs.to }}
      arms: ${{ steps.p.outputs.arms }}
      reuse: ${{ steps.p.outputs.reuse }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          head, arms = {}, []
          for line in open('lab/scaling-arms.txt'):
              line = line.rstrip('\n')
              m = re.match(r'^#\s*(days|from|to|reuse)=(\S+)', line)
              if m: head[m.group(1)] = m.group(2); continue
              if not line.strip() or line.lstrip().startswith('#'): continue
              tag, _, ov = line.partition(':')
              assert re.match(r'^[a-z0-9_]+$', tag.strip()), tag
              for kv in ov.split():
                  assert re.match(r'^[A-Z][A-Z0-9_]*=[A-Za-z0-9_.,:-]*$', kv), kv
              arms.append({'tag': tag.strip(), 'overrides': ' '.join(ov.split())})
          assert arms and len(arms) <= 12
          print('days=' + head['days']); print('from=' + head['from']); print('to=' + head['to'])
          # reuse=<run id>: the arms unpack that run's copy (kept 2 days) instead of copying from the server again, so a
          # rerun of the same stretch puts no load on the server.
          reuse = head.get('reuse', '')
          assert re.match(r'^[0-9]*$', reuse), reuse
          print('reuse=' + reuse)
          print('arms=' + json.dumps(arms))
          PY
          cat "$GITHUB_OUTPUT"

  copy:
    needs: [plan]
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the audit log, the recordings the stretch needs, the model and the settings (read-only)
        env:
          CHECK_DAYS: ${{ needs.plan.outputs.days }}
          CHECK_FROM: ${{ needs.plan.outputs.from }}
          CHECK_TO: ${{ needs.plan.outputs.to }}
          SKIP_MODELS: ''
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/audit" "$DATA/models" "$DATA/sweep-env" "$DATA/sweeps"
          for f in $SKIP_MODELS; do [[ "$f" =~ ^(vol_profile|vol_model|fill_model|session_risk|rule_book|gp_indicators)\.json$ ]] || { echo "skip_models: $f is not one of the model files the check copies"; exit 1; }; done
          # A model file left out (skip_models): one the paper bot did not have yet in the stretch.
          wanted() { case " $SKIP_MODELS " in *" $1 "*) echo "$1 left out (skip_models)"; return 1;; esac; }
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          # Every file off the server at most 8 MB/s, uncompressed (rsync -z would compress on the server).
          pull() { rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" "$@"; }
          D=$(echo "${CHECK_DAYS:-$(date -u -d yesterday +%F),$(date -u +%F)}" | tr -d ' ')
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]] || { echo "days must be YYYY-MM-DD[,YYYY-MM-DD...]"; exit 1; }
          echo "$D" > "$DATA/sweeps/check-days.txt"
          # The stretch ends now (the recordings are copied after this), or where the input says.
          TO=$(date -u +%FT%TZ)
          if [ "$CHECK_TO" != now ]; then
            [[ "$CHECK_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$ ]] || { echo "to must be an ISO time like 2026-10-28T03:10:00Z, or now"; exit 1; }
            TO="$CHECK_TO"
          fi
          echo "$TO" > "$DATA/sweeps/check-to.txt"
          PAT=$(echo "$D" | tr ',' '\n' | sed -E "s/^(.+)$/-name 'audit-\1*' -o/" | tr '\n' ' ' | sed -E 's/ -o $//')
          ssh bot "cd ~/bot/data/audit && find . -maxdepth 1 -type f \( $PAT \) -printf '%P\n'" > "$RUNNER_TEMP/audit.txt"
          pull --files-from="$RUNNER_TEMP/audit.txt" bot:bot/data/audit/ "$DATA/audit/" || vanished_ok
          # The take-profit bench's and the accuracy gate's scoreboards now, read right after the audit log (whose bench
          # events wind the bench back): the replay starts from them as they stood when the stretch began.
          pull bot:bot/data/take-profit-bench.json "$RUNNER_TEMP/paper-tp-bench.json" 2>/dev/null || true
          pull bot:bot/data/accuracy_gate.json "$RUNNER_TEMP/paper-accuracy-gate.json" 2>/dev/null || true
          # Paper's settled entries (the newest ~4 MB, as the bot reads them): the replay's optimal f cap starts from the
          # ones settled before the stretch.
          ssh bot "tail -c 4000000 ~/bot/data/trades.jsonl" > "$RUNNER_TEMP/paper-trades.jsonl" 2>/dev/null || rm -f "$RUNNER_TEMP/paper-trades.jsonl"
          # The stretches checked before, for the luck test's tally (the verdict adds this one and copies it back).
          pull bot:bot/data/models/sweeps/replay-check-history.json "$DATA/sweeps/" 2>/dev/null || true
          # The paper account's equity at cost now (its cash plus what the contracts it holds cost; cash alone leaves out what
          # open positions tie up): the check backs out what paper settled since the stretch began.
          pull bot:bot/data/paper_exchange.json "$RUNNER_TEMP/paper_exchange.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/paper_exchange.json" > "$RUNNER_TEMP/paper-balance" 2>/dev/null <<'PY' || rm -f "$RUNNER_TEMP/paper-balance"
          import json, sys
          s = json.load(open(sys.argv[1]))
          basis, held = s.get('basis') or {}, s.get('positions') or {}
          print(round(s['balance'] + sum((basis.get(t) or {}).get('yesCost', 0) + (basis.get(t) or {}).get('noCost', 0) for t, n in held.items() if n), 4))
          PY
          # The bot's equity guard (the break-even it sizes against, its tier) and the dashboard's kill-switch override (on
          # unless turned off), so the replay sizes and pauses as the bot does.
          pull bot:bot/data/equity_guard.json "$RUNNER_TEMP/paper-guard.json" 2>/dev/null || rm -f "$RUNNER_TEMP/paper-guard.json"
          pull bot:bot/data/control.json "$RUNNER_TEMP/control.json" 2>/dev/null || true
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); print("false" if s.get("killOverride") is False else "true")' "$RUNNER_TEMP/control.json" > "$RUNNER_TEMP/kill-override" 2>/dev/null || echo true > "$RUNNER_TEMP/kill-override"
          # The bot's recent maker fills' 60 s markouts, read as its TCA reloads them (the log's last 4 MB, paper fills of
          # the last 7 days, the newest 2000, maker fills with a 60 s markout): they seed the replay's maker buffer.
          ssh bot "tail -c 4000000 ~/bot/data/tca/tca.jsonl" > "$RUNNER_TEMP/tca-tail.jsonl" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/tca-tail.jsonl" > "$RUNNER_TEMP/maker-markouts.json" 2>/dev/null <<'PY' || echo '[]' > "$RUNNER_TEMP/maker-markouts.json"
          import json, sys, time
          now = time.time() * 1000
          text = open(sys.argv[1], 'rb').read().decode('utf8', 'replace')
          recs = []
          for line in text.split('\n'):
              try: r = json.loads(line)
              except Exception: continue
              if isinstance(r, dict) and r.get('mode') == 'paper' and isinstance(r.get('ts'), (int, float)) and now - r['ts'] <= 7 * 86400000 and r.get('markouts'):
                  recs.append(r)
          print(json.dumps([r['markouts']['60s'] for r in recs[-2000:] if not r.get('isTaker') and isinstance(r['markouts'].get('60s'), (int, float))]))
          PY
          NEED=$(node --import tsx research/replayCheck.ts --plan --audit data/audit --days "$D" --from "$CHECK_FROM" --to "$TO")
          [[ "$NEED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]] || { echo "could not work out the stretch"; exit 1; }
          for d in ${NEED//,/ }; do
            f="md-$d.jsonl"
            # A plain file is the day being recorded (or one not compressed yet): copied as it stands and gzipped on the
            # runner (a torn last line is skipped).
            if ssh bot "test -f ~/bot/data/recordings/$f"; then
              pull "bot:bot/data/recordings/$f" "$DATA/recordings/" || vanished_ok; [ ! -f "$DATA/recordings/$f" ] || gzip -1 "$DATA/recordings/$f"
            elif ssh bot "test -f ~/bot/data/recordings/$f.gz"; then
              # Today's is the bot's live gzip (#172: a member every few seconds): read as it stands, the readers skip a
              # last member still being written. Finished days are copied whole.
              if [ "$d" = "$(date -u +%F)" ]; then scp -q -l 64000 "bot:bot/data/recordings/$f.gz" "$DATA/recordings/$f.gz"
              else pull "bot:bot/data/recordings/$f.gz" "$DATA/recordings/" || vanished_ok; fi
            fi
          done
          echo "$(echo "$D,$NEED" | tr ',' '\n' | sort -u | paste -sd, -)" > "$DATA/sweeps/check-days.txt"
          pull bot:bot/data/models/model.json "$DATA/models/" || echo "no trained model on the server: the check uses the identity model"
          # The other models the engine prices with (the vol profile, vol model and fill model), where the server has them;
          # else the shipped params/ files, as the bot picks them.
          for f in vol_profile.json vol_model.json fill_model.json session_risk.json; do wanted "$f" || continue; pull "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || true; done
          # The validation gates' state (which books' unvalidated models are benched).
          pull bot:bot/data/probation.json "$RUNNER_TEMP/paper-probation.json" 2>/dev/null || true
          # The TA network the engine prices with (its promoted copy and the newest archived versions its ensemble blends),
          # the rule book and the evolved formula (both among the signals that order the engine's markets), the component
          # trials' verdicts, and the index series the network's context and the market context read (dominance, the slow
          # indexes, the risk gauges) from the bot's history directory.
          for f in ta_net.json rule_book.json gp_indicators.json; do wanted "$f" || continue; pull "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || true; done
          mkdir -p "$DATA/models/archive/ta_net" "$DATA/history"
          ssh bot 'ls -1 ~/bot/data/models/archive/ta_net/*.json 2>/dev/null | sort -r | head -4' | while read -r f; do pull "bot:$f" "$DATA/models/archive/ta_net/" 2>/dev/null || true; done
          pull bot:bot/data/component_trials.json "$RUNNER_TEMP/paper-trials.json" 2>/dev/null || true
          INC=(--include='/*/'); for a in BTCDOM BTC.D USDT.D TOTAL3 OTHERS.D RTY DXY US10Y VIX HYG; do INC+=("--include=/*/$a/***"); done
          pull --prune-empty-dirs --max-size=50m "${INC[@]}" --exclude='*' bot:bot/data/history/ "$DATA/history/" 2>/dev/null || true
          echo "TA network $([ -f "$DATA/models/ta_net.json" ] && echo "from the server" || echo "shipped") + $(ls "$DATA/models/archive/ta_net" | wc -l) archived; rule book $([ -f "$DATA/models/rule_book.json" ] && echo read || echo 'not read'); trials $([ -s "$RUNNER_TEMP/paper-trials.json" ] && echo read || echo 'not read'); index series $(find "$DATA/history" -name '*.csv' | wc -l) file(s)"
          # The server's settings without any credential line and without server paths (the same filter as Remote training).
          ssh bot "grep -E '^[A-Z][A-Z0-9_]*=' ~/bot/bot.env" | grep -vE 'KEY|SECRET|TOKEN|PASSWORD|PRIVATE|PEM|CREDENTIAL|^BIND_HOST=|^ALLOW_NON_LOOPBACK|^PORT=' | grep -vE '^[A-Z0-9_]+=["'"'"']?(/|~)' > "$DATA/sweep-env/train.env" || true
          echo "audit days $D: $(wc -l < "$RUNNER_TEMP/audit.txt") file(s); recorded days $NEED: $(ls "$DATA/recordings" | wc -l) file(s); settings $(wc -l < "$DATA/sweep-env/train.env") line(s); paper balance $([ -s "$RUNNER_TEMP/paper-balance" ] && echo read || echo 'not read'), equity guard $([ -s "$RUNNER_TEMP/paper-guard.json" ] && echo read || echo 'not read'), override $(cat "$RUNNER_TEMP/kill-override"), maker markouts $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/maker-markouts.json" 2>/dev/null || echo 0)"
          du -sh "$DATA/recordings" | cat
      - name: Pack the copy for the arms
        run: |
          mkdir -p data/lab-temp
          cp "$RUNNER_TEMP"/paper-* "$RUNNER_TEMP"/kill-override "$RUNNER_TEMP"/maker-markouts.json data/lab-temp/ 2>/dev/null || true
          tar -cf lab-copy.tar data
          ls -la lab-copy.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lab-copy
          path: lab-copy.tar
          retention-days: 2

  arm:
    needs: [plan, copy]
    if: always() && needs.plan.result == 'success' && (needs.copy.result == 'success' || (needs.copy.result == 'skipped' && needs.plan.outputs.reuse != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJson(needs.plan.outputs.arms) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - uses: actions/download-artifact@v4
        with:
          name: lab-copy
          run-id: ${{ needs.plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the copy
        run: |
          tar -xf lab-copy.tar && rm lab-copy.tar
          cp data/lab-temp/* "$RUNNER_TEMP"/ 2>/dev/null || true
      - name: Replay check (backtester vs paper, since the bot's last start)
        env:
          CHECK_FROM: ${{ needs.plan.outputs.from }}
          MIN_HOURS: '3'
          NEARBY: '0.95 0.975 1.025 1.05'
          PHASES: '200 400 600 800'
          PNL_TEST: 'luck'
          OVERRIDES: ${{ matrix.arm.overrides }}
        run: |
          set -a; . data/sweep-env/train.env; set +a
          # Replay-only overrides (an exit policy to compare, say) on top of the server's settings; paper's side is what it did.
          for kv in $OVERRIDES; do export "$kv"; echo "replay-only override: $kv"; done
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper
          BAL=$(cat "$RUNNER_TEMP/paper-balance" 2>/dev/null || true)
          GUARD="$RUNNER_TEMP/paper-guard.json"; [ -s "$GUARD" ] || GUARD=""
          OVERRIDE=$(cat "$RUNNER_TEMP/kill-override" 2>/dev/null || echo true)
          ARGS=(--recordings data/recordings --audit data/audit --days "$(cat data/sweeps/check-days.txt)" --from "$CHECK_FROM" --to "$(cat data/sweeps/check-to.txt)"
            --min-hours "$MIN_HOURS" ${BAL:+--paper-balance-now "$BAL"} ${GUARD:+--paper-guard "$GUARD"} --kill-override "$OVERRIDE"
            --maker-markouts "$RUNNER_TEMP/maker-markouts.json" --paper-probation "$RUNNER_TEMP/paper-probation.json" --paper-trials "$RUNNER_TEMP/paper-trials.json"
            --paper-tp-bench "$RUNNER_TEMP/paper-tp-bench.json" --paper-accuracy-gate "$RUNNER_TEMP/paper-accuracy-gate.json" --paper-trades "$RUNNER_TEMP/paper-trades.jsonl" --model data/models/model.json)
          T0=$(date +%s); mkdir -p data/sweeps/nearby; [ "$NEARBY" = none ] && NEARBY=''
          # The spot candles the bot held when the replay starts (its startup fetch from Coinbase, made for that time): a
          # stretch that begins in the middle of a run otherwise replays with only the bars recorded since, too few for the
          # TA network, and prices without its volatility forecast (Oct 27: the fair value 1.5c off paper's).
          node --import tsx research/replayCheck.ts "${ARGS[@]}" --fetch-seed data/sweeps/seed-candles.json || echo "spot candles for the replay's start: not fetched (the recorded ones only)"
          [ -s data/sweeps/seed-candles.json ] && ARGS+=(--seed-candles data/sweeps/seed-candles.json)
          # One replay's P&L is path-sensitive (the same code at a $64 or a $74 bankroll made -$11.63 or -$32.76 over one
          # stretch): the stretch also replays at bankrolls a few percent off paper's, each evaluating at another point of
          # the second (paper's 1 s timer could have fallen anywhere in it), side by side (first in line for the
          # out-of-memory killer, so the check's own replay is the last to go), and the verdict holds their median to paper's.
          read -ra PH <<< "$PHASES"; i=0
          for s in $NEARBY; do
            ph="${PH[$i]:-0}"; i=$((i + 1))
            [[ "$ph" =~ ^[0-9]{1,3}$ ]] || { echo "phases must be whole ms below 1000"; exit 1; }
            choom -n 900 -- timeout 320m node --import tsx research/replayCheck.ts "${ARGS[@]}" --bankroll-scale "$s" --tick-phase-ms "$ph" --out "data/sweeps/nearby/$s.json" > "$RUNNER_TEMP/nearby-$s.log" 2>&1 &
          done
          { timeout 320m node --import tsx research/replayCheck.ts "${ARGS[@]}" --tick-phase-ms 0 --out data/sweeps/replay-check-own.json || echo "replay check failed or cut off"; } 2>&1 | tee "$RUNNER_TEMP/own.log"
          wait
          for s in $NEARBY; do [ -s "data/sweeps/nearby/$s.json" ] || echo "nearby replay x$s did not finish: $(grep -E 'Error|Killed|heap' "$RUNNER_TEMP/nearby-$s.log" | tail -n 1 | cut -c1-160)"; done
          if [ -s data/sweeps/replay-check-own.json ]; then
            # The tally counts only stretches replayed by this same backtester (a hash of its files: a fix starts afresh).
            CODE=$(cat research/backtest.ts research/replay.ts research/callTape.ts research/replayCheck.ts research/seedCandles.ts | sha256sum | cut -c1-8)
            node --import tsx research/replayCheck.ts --combine data/sweeps/replay-check-own.json --nearby "$(ls data/sweeps/nearby/*.json 2>/dev/null | paste -sd, -)" \
              --history data/sweeps/replay-check-history.json --code "$CODE" --pnl-test "$PNL_TEST" --out data/sweeps/replay-check-latest.json 2>&1 | tee -a "$RUNNER_TEMP/own.log"
          fi
          echo "replay check took $(( ($(date +%s) - T0) / 60 )) min; memory now $(free -m | awk '/^Mem:/ {print $3 " MB used of " $2}')"
      - name: Post the arm's summary on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.arm.tag }}
          OVERRIDES: ${{ matrix.arm.overrides }}
        run: |
          LOG="$RUNNER_TEMP/own.log"; [ -s "$LOG" ] || { echo "no replay output to post"; exit 0; }
          { echo "**Scaling lab** arm \`$TAG\` run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)${OVERRIDES:+ · overrides: \`$OVERRIDES\`}"
            echo; echo '```'; cut -c1-600 "$LOG" | head -n 170; echo '```'; } > "$RUNNER_TEMP/comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - --jq '.html_url'
