# Read-only health report from the Lightsail box, run manually from the Actions tab (or the API).
# Changes nothing on the server: prints the service state, load, memory, disk, the busiest processes,
# how fast the dashboard API answers, and the bot's recent log.
name: Server diagnostics

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Optional: extra read-only dashboard API paths to print, space separated (e.g. /api/snn /api/autotrain)'
        required: false
        default: ''
      pnl:
        description: 'Also run the P&L forensics (deploy/pnl_report.py, decision_study.py, cross_study.py, component_study.py, feed_delay.py, latency_study.py from the dispatched ref; read-only, a few minutes)'
        required: false
        default: 'false'
      timings:
        description: 'Also print where training time goes (deploy/step_timings.py from the dispatched ref: minutes per pipeline step from the reports; read-only)'
        required: false
        default: 'false'
      study_hours:
        description: 'With pnl: hours of positions the exit study replays (whole number, 1-24; about a minute of server time an hour)'
        required: false
        default: '8'
      ta_study:
        description: 'Instead of the server report: run the TA contract study (research/taContractStudy.ts) on this runner, no server involved'
        required: false
        default: 'false'
      ta_from:
        description: 'With ta_study: first replayed day (YYYY-MM-DD; empty = 120 days before ta_to)'
        required: false
        default: ''
      ta_to:
        description: 'With ta_study: last replayed day (YYYY-MM-DD; empty = the day before yesterday)'
        required: false
        default: ''
      ta_assets:
        description: 'With ta_study: coins, comma separated'
        required: false
        default: 'BTC,ETH,SOL,XRP,DOGE'

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.ta_study != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        if: inputs.pnl == 'true' || inputs.timings == 'true'
      - name: Upload the report scripts
        if: inputs.pnl == 'true' || inputs.timings == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: deploy/pnl_report.py,deploy/decision_study.py,deploy/cross_study.py,deploy/component_study.py,deploy/feed_delay.py,deploy/latency_study.py,deploy/step_timings.py
          target: /tmp/diag
      - name: Report
        uses: appleboy/ssh-action@v1.0.3
        env:
          EXTRA_PATHS: ${{ inputs.paths }}
          PNL: ${{ inputs.pnl }}
          TIMINGS: ${{ inputs.timings }}
          STUDY_HOURS: ${{ inputs.study_hours }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          command_timeout: 55m
          envs: EXTRA_PATHS,PNL,TIMINGS,STUDY_HOURS
          script: |
            # The dashboard API needs the dashboard password when one is set. It is read here, on the server, from
            # bot.env and handed to curl on stdin (never on a command line, never printed): it doesn't leave the box.
            PW=$(sed -n 's/^DASHBOARD_PASSWORD=//p' ~/bot/bot.env 2>/dev/null | tail -1 | tr -d '\r')
            case "$PW" in \"*\") PW=${PW#\"}; PW=${PW%\"};; esac
            api() { _p=$1; shift; if [ -n "$PW" ]; then printf 'Authorization: Bearer %s\n' "$PW" | curl -s -m 20 -H @- "$@" "http://localhost:3000$_p"; else curl -s -m 20 "$@" "http://localhost:3000$_p"; fi; }
            echo "== release: $(cat ~/bot/current/dist/RELEASE 2>/dev/null)"
            echo "== uptime / load"; uptime
            echo "== cpu over 5 s (us = bot, st = taken back by the host when burst credits run out)"; vmstat 1 5
            echo "== memory"; free -m
            echo "== disk"; df -h / | tail -1
            echo "== largest folders (read-only)"; du -xh --max-depth=3 ~ 2>/dev/null | sort -rh | head -25
            echo "== recordings by day"; for d in ~/bot/data/recordings/*/; do [ -d "$d" ] && echo "$(du -sh "$d" 2>/dev/null | cut -f1) $(basename "$d")"; done | head -40
            echo "== journal / tmp"; sudo journalctl --disk-usage 2>/dev/null; du -sh /tmp /var/log 2>/dev/null
            echo "== audit log (newest files; a day splits into parts at AUDIT_MAX_FILE_MB)"; du -sh ~/bot/data/audit 2>/dev/null; ls -la ~/bot/data/audit 2>/dev/null | tail -4
            echo "== service"; systemctl status kalshi-bot --no-pager -l | head -15
            echo "== restarts"; systemctl show kalshi-bot -p NRestarts -p ActiveEnterTimestamp -p MemoryCurrent
            echo "== top processes"; ps -eo pid,ppid,etime,pcpu,pmem,rss,args --sort=-pcpu | head -12 | cut -c1-200
            echo "== dashboard API timing"
            echo "(dashboard password: $([ -n "$PW" ] && echo "set, sent from bot.env" || echo "not set"))"
            for p in auth status markets; do api "/api/$p" -o /dev/null -w "/api/$p  %{http_code}  %{time_total}s\n" || echo "/api/$p  no reply in 20s"; done
            echo "== trading"
            api /api/status | python3 -c 'import json,sys; s=json.load(sys.stdin); print("entries", json.dumps(s.get("entryDiagnosis"))); print("halts", s.get("haltReasons")); [print("feed", a, "index", f.get("index"), "coinbase", f.get("spot"), "binance", f.get("binance")) for a, f in (s.get("feeds") or {}).items()]; print("bankroll", s.get("bankroll"), "daily pnl", s.get("dailyPnl"), "| balance", s.get("balance")); v=s.get("vault") or {}; print("vault", "(bookkeeping only in paper)" if v.get("paperIgnored") else "(excluded from the bankroll)", json.dumps({x: v.get(x) for x in ("enabled","vault","pocket","reserved","quotaUsd","quotaFilled","phase","winShare","pocketShare","ramp","dailyVaulted","realized")})); ag=(s.get("guards") or {}).get("accuracyGate") or {}; [print("accuracy gate", grp, "enforced" if ag.get("enforced") else "not enforced", "k", x.get("k"), " ".join(str(b.get("lo")) + "-" + str(b.get("hi")) + "s n=" + str(b.get("n")) + " " + str(b.get("llBot")) + " vs " + str(b.get("llMid")) + (" open" if b.get("open") else " BLOCKED") for b in x.get("buckets") or [])) for grp, x in (ag.get("groups") or {}).items()]; gt=(s.get("guards") or {}).get("tier") or {}; print("sizing tier", json.dumps({x: gt.get(x) for x in ("name","reference","orderFrac","orderRiskUsd","kellyFraction","ddScaleAt","dailyLossLimitUsd")}), "| sizing", (s.get("guards") or {}).get("sizing"), "| target EV $", (s.get("guards") or {}).get("targetEvUsd"), "| paper order $", (s.get("guards") or {}).get("paperOrderUsd")); print("cpu", json.dumps((s.get("guards") or {}).get("cpu"))); print("latency", json.dumps(s.get("latency"))); k=s.get("kalshiIndexFeed") or {}; print("kalshi index feed", json.dumps({x: k.get(x) for x in ("connected","lastMessageAgoMs","received","parsed","dropped","ids","lagMs","transitMs","vendorMs","unknownTypes")})); print("kalshi index control", k.get("control")); print("kalshi index lastRaw", (k.get("lastRaw") or "")[:400]); print("kalshi index lastDropped", (k.get("lastDropped") or "")[:400]); print("market", json.dumps(s.get("market"))); print("rule book", json.dumps(s.get("ruleBook"))); print("kalshi check", json.dumps(s.get("kalshiCheck"))); print("fee schedule", json.dumps(s.get("feeSchedule"))); g=s.get("guards") or {}; print("entries: maker buffer", g.get("makerBuffer"), "| 60 s maker markout", json.dumps(g.get("makerMarkout60")), "| min quote", g.get("minQuoteContracts"), "| vol fallback x", g.get("volFallbackMult"), "| windows", g.get("entryWindowUpdown"), g.get("entryWindowHourly"), "| take-profit", json.dumps(g.get("takeProfit")), "| orders", json.dumps(g.get("orders")))' || true
            api "/api/orders?limit=300" | python3 -c 'import json,sys,collections; o=json.load(sys.stdin); o=o if isinstance(o, list) else []; print("recent orders", len(o), dict(collections.Counter((x.get("purpose"), x.get("state")) for x in o))); [print("  ", x.get("ticker"), x.get("side"), x.get("count"), x.get("price"), x.get("state"), (x.get("why") or "")[:40]) for x in o[:10]]' || true
            echo "== cpu (last minute; cores: 1 = one full core; the plan sustains about 0.4) and 10-minute history"
            api /api/cpu | python3 -c 'import json,sys,time; d=json.load(sys.stdin); n=d.get("now") or {}; print("now", json.dumps({k: n.get(k) for k in ("processCores","threads","mainBusy","stealPct","iowaitPct","writeMBps","rssMb","sections")})); print("state file writes since start", json.dumps(n.get("stateWrites"))); [print("  ", time.strftime("%H:%M", time.gmtime(h["ts"]/1000)), "cores", h["cores"], "main", h["mainBusy"], "steal%", h["stealPct"], "iowait%", h["iowaitPct"], "writeMB/s", h["writeMBps"], "rssMB", h["rssMb"]) for h in (d.get("history") or [])[-18:]]' || true
            echo "== perps, tennis and SNNs (neural map blocks: lit = pixels with a value; an all-dark block has none)"
            api /api/neural-map | python3 -c 'import json,sys; m=json.load(sys.stdin); [print("  %-6s %-24s lit %3d/%-3d score %-5s activity %.2f  %s" % (L["id"], b["label"][:24], sum(1 for c in b["cells"] if abs(c) > 0.01), len(b["cells"]), b["score"], b["activity"], str(b["note"])[:120])) for L in m.get("layers", []) if L["id"] in ("feeds", "snn", "models", "bots") for b in L["blocks"]]' || true
            api /api/status | python3 -c 'import json,sys; s=json.load(sys.stdin); p=s.get("perps") or {}; t=p.get("trading") or {}; print("perps feed", json.dumps(p.get("feed")), "| markets", [(m.get("asset"), m.get("ticker"), m.get("premiumBps") is not None, m.get("fundingRate") is not None) for m in p.get("markets") or []]); print("perps trading", json.dumps({k: t.get(k) for k in ("mode", "strategy", "signal", "modelError", "lastError", "dayHalt", "equity")}), "| keys", sorted(t.keys())[:24]); print("perps trading model", json.dumps(t.get("model"))[:400]); print("perps hedge", json.dumps(p.get("hedge"))[:300]); tn=s.get("tennis") or {}; ms=tn.get("matches") or []; print("tennis enabled", tn.get("enabled"), "| trading", tn.get("trading"), "| budget", json.dumps(tn.get("budget"))[:200], "| matches", len(ms)); [print("  ", x.get("event"), x.get("phase"), x.get("pA"), "score" if x.get("score") else "no score", str(x.get("scoreRaw"))[:80], (x.get("notes") or [])[:2]) for x in ms[:8]]' || true
            api /api/status | python3 -c 'import json,sys,time; s=json.load(sys.stdin); t=(s.get("perps") or {}).get("trading") or {}; L=t.get("lanes") or {}; hm=lambda ms: time.strftime("%m-%d %H:%M", time.gmtime(ms/1000)) if isinstance(ms, (int, float)) else ms; print("perps setups today", json.dumps(t.get("today")), "| queues", {k: len((v or {}).get("queue") or []) for k, v in L.items()}, "| open", {k: len((v or {}).get("open") or []) for k, v in L.items()}, "| size scale", t.get("sizeScale")); [print("  trade", x.get("asset"), x.get("lane"), x.get("kind"), x.get("dir"), "exit", hm(x.get("exitTs")), "R", x.get("r"), "usd", x.get("usd"), x.get("reason")) for x in (t.get("recentTrades") or [])[:6]]; [print("  skip", json.dumps(x)[:200]) for x in (t.get("recentSkips") or [])[:8]]; [print("  decision", k, json.dumps(v)[:200]) for k, v in list((t.get("decisions") or {}).items())[:6]]; ms=(s.get("tennis") or {}).get("matches") or []; ph={}; [ph.__setitem__(x.get("phase"), ph.get(x.get("phase"), 0) + 1) for x in ms]; print("tennis phases", ph); [print("  match", x.get("event"), x.get("phase"), "pA", x.get("pA"), "fairA", x.get("fairA"), "progress", x.get("progress"), (x.get("notes") or [])[:3]) for x in ms if x.get("phase") not in ("scheduled", "pre")][:10]' || true
            api "/api/orders?limit=500" | python3 -c 'import json,sys,collections; o=json.load(sys.stdin); o=o if isinstance(o, list) else []; tn=[x for x in o if str(x.get("why") or "").startswith("tennis")]; print("tennis orders in the last 500", len(tn), dict(collections.Counter(x.get("state") for x in tn))); [print("  ", x.get("ticker"), x.get("side"), x.get("count"), x.get("price"), x.get("state"), str(x.get("why"))[:70]) for x in tn[:6]]' || true
            api /api/snn | python3 -c 'import json,sys; s=json.load(sys.stdin); print("snn mode", s.get("mode")); [print("  snn", d, "stage", u.get("stage"), "| shadow", u.get("shadow"), "| host", json.dumps({k: (u.get("host") or {}).get(k) for k in ("mode", "timeouts", "lastError", "restoredFrom")}), "| columns", len((u.get("network") or {}).get("columns") or ((u.get("network") or {}).get("network") or {}).get("columns") or []), "| network keys", sorted((u.get("network") or {}).keys())[:14]) for d, u in (s.get("units") or {}).items()]' || true
            echo "-- perps setups and tennis orders in the audit log, last 5 days (per UTC day)"
            find ~/bot/data/audit -name 'audit-*.jsonl' -mtime -5 2>/dev/null | sort | while read -r f; do LC_ALL=C nice -n 19 grep -hE '"kind":"setup_(signal|trade|skip)"|"strategy":"tennis"' "$f"; done | python3 -c 'import json,sys,collections; D=collections.defaultdict(collections.Counter); R=collections.Counter(); last=[]; [(lambda r: (lambda d, k, x: (D[d].update([k + (":queued" if x.get("queued") else ":not queued" if x.get("score") is not None else ":no score") if k == "setup_signal" else k + ":" + str(x.get("event") or x.get("strategy") or "")]), R.update([str(x.get("reason"))[:90]]) if k == "setup_skip" else None, last.append((r["ts"][:16], x.get("asset"), x.get("tf"), x.get("kind"), x.get("dir"), x.get("score"), x.get("queued"))) if k == "setup_signal" else None))(r["ts"][:10], r.get("kind"), r.get("data") or {}))(json.loads(l)) for l in sys.stdin if l.strip()]; [print("  ", d, dict(c)) for d, c in sorted(D.items())]; [print("   skip", n, why) for why, n in R.most_common(6)]; [print("   signal", *x) for x in last[-6:]]' || true
            echo "-- perps / tennis log lines, last 24 h (newest 20)"
            journalctl -u kalshi-bot --since "24 hours ago" --no-pager | grep -iE "perp-feed|perps market data|perp-trader|setup trader|tennis" | grep -v "snn-health" | sed -E 's/^.*kalshi-bot\[[0-9]+\]: //; s/^.*node\[[0-9]+\]: //' | cut -c1-260 | tail -20
            echo "== state files"; ls -la ~/bot/data/*.json 2>/dev/null | awk '{print $5, $9}' | sort -rn | head -8
            echo "== trained model files (modified UTC, bytes, name; files the laptop trainer sends keep the laptop's times)"
            find ~/bot/data/models -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' 2>/dev/null | sort | tail -60
            echo "== models the bot hot-swapped in the last 5 days (UTC, model, file)"
            find ~/bot/data/audit -name 'audit-*.jsonl' -mtime -5 2>/dev/null | sort | while read -r f; do LC_ALL=C nice -n 19 grep -hF '"hot_swap"' "$f"; done | python3 -c 'import json,sys; [print(r["ts"][:16], (r.get("data") or {}).get("kind"), str((r.get("data") or {}).get("file") or "").split("/")[-1]) for r in (json.loads(l) for l in sys.stdin if l.strip())]' | tail -60 || true
            echo "== OOM / kills"; sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process" | tail -5 || true
            echo "== warnings and errors, last 3 h (counted)"
            journalctl -u kalshi-bot --since "3 hours ago" --no-pager | grep -E "ERROR|WARN|Started|Stopped|exited" | sed -E 's/^.*kalshi-bot\[[0-9]+\]: //; s/^[0-9TZ:.-]+ //; s/\{.*//' | sort | uniq -c | sort -rn | head -25
            echo "== live learning (does the running bot adapt to its results?)"
            api /api/status | python3 -c '
            import json, sys
            s = json.load(sys.stdin); g = s.get("guards") or {}
            J = lambda v, n=360: (json.dumps(v, default=str)[:n] if v is not None else "none")
            m = s.get("model") or {}
            print("model", m.get("id"), "| kind", m.get("kind"), "| live blockers", J(m.get("liveBlockers"), 200))
            print("model vs market on settled windows (advantage > 0 = model better):", J(g.get("modelHealth")))
            print("TA tilt vs math alone on settled windows:", J(g.get("taHealth")))
            eg = g.get("equityGuard") or {}
            print("size vs break-even: net P&L", eg.get("netPnl"), "| size x", eg.get("sizeScale"), "| break-even", eg.get("breakEven"))
            print("optimal f from settled trades:", J(g.get("optimalF"), 300))
            print("maker discount from 60 s markouts: buffer", g.get("makerBuffer"), "| markout", J(g.get("makerMarkout60")))
            print("probation:", J(s.get("probation"), 500))
            print("exit curve:", J(s.get("curveExit"), 450))
            print("entry curve:", J(s.get("curveEntry"), 400))
            print("tree models:", J(s.get("treeModels"), 400))
            print("snn brief:", J(s.get("snn"), 500))' || true
            api /api/snn | python3 -c '
            import json, sys
            s = json.load(sys.stdin)
            for d, u in (s.get("units") or {}).items():
                print("snn", d, "| stage", u.get("stage"), "| shadow", u.get("shadow"), "| keys", sorted(u.keys())[:24])
                print("   health", json.dumps(u.get("health"), default=str)[:500])
                net = u.get("network") or {}
                print("   network keys", sorted(net.keys())[:24])' || true
            api /api/autotrain | python3 -c '
            import json, sys, time
            a = json.load(sys.stdin)
            print("auto-train mode", a.get("mode"), "| running", a.get("running"), "| last exit", json.dumps(a.get("lastExit")), "| next", a.get("nextRun"))
            for k, v in sorted((a.get("models") or {}).items()):
                print("  model file", k, "|", (str(round((time.time() * 1000 - v["mtime"]) / 3.6e6, 1)) + " h old") if v.get("mtime") else "missing", "|", v.get("id") or "")
            print("  hot swaps", json.dumps(a.get("swaps"), default=str)[:400])' || true
            echo "== exit curve, vault and mode settings in bot.env (none of these keys holds a secret)"
            grep -E '^(TRADING_MODE|SINUOUS_[A-Z_]+|VAULT_[A-Z_]+|LIVE_ALLOW_UNVALIDATED_MODEL)=' ~/bot/bot.env 2>/dev/null || echo "(none set: the defaults)"
            echo "== live books at rest (read from DATA_DIR/live while paper runs)"
            python3 - <<'PYEOF' || true
            import json, os
            base = os.path.expanduser('~/bot/data/live')
            def load(name):
                try: return json.load(open(os.path.join(base, name)))
                except Exception as e: return {'unreadable': str(e)[:80]}
            v = load('vault.json')
            ev = [(e.get('kind'), e.get('amount')) for e in (v.get('events') or [])[-6:]]
            print('live vault', json.dumps({k: v.get(k) for k in ('vault', 'quotaFilled', 'withdrawnTotal', 'realized', 'unreadable')}), '| pocket', round(sum(p.get('amount', 0) for p in v.get('pocket') or []), 2), '| last events', ev)
            c = load('curve-exit.json')
            r = c.get('results') or []
            print('live exit curve', json.dumps({'results': len(r), 'netUsd': round(sum(r), 2), 'restartTag': c.get('restartTag'), 'benched': c.get('benched'), 'crossesPending': len(c.get('crosses') or []), 'unreadable': c.get('unreadable')}))
            g = load('equity_guard.json')
            h = g.get('history') or []
            print('live break-even', g.get('reference'), '| last hourly equity', h[-1] if h else None)
            PYEOF
            echo "== learning and settlement report"
            if [ -f ~/bot/current/deploy/learning_report.py ]; then python3 ~/bot/current/deploy/learning_report.py ~/bot/data || true; else echo "(learning report ships with the next release)"; fi
            echo "== module report (what is on, validated, earning or stale; deploy/module_report.py)"
            if [ -f ~/bot/current/deploy/module_report.py ]; then python3 ~/bot/current/deploy/module_report.py ~/bot/data 24 || true; else echo "(module report ships with the next release)"; fi
            for p in $EXTRA_PATHS; do
              case "$p" in /api/*) ;; *) echo "skipping $p (only /api/... paths)"; continue;; esac
              echo "== GET $p"; api "$p" | head -c 6000; echo
            done
            if [ "$PNL" = "true" ] && [ -d /tmp/diag/deploy ]; then
              echo "== P&L report"; nice -n 19 python3 /tmp/diag/deploy/pnl_report.py ~/bot/data 3 || true
              echo "== decision study"; nice -n 19 python3 /tmp/diag/deploy/decision_study.py ~/bot/data 3 || true
              case "$STUDY_HOURS" in ''|*[!0-9]*) STUDY_HOURS=8;; esac
              if [ "$STUDY_HOURS" -lt 1 ] || [ "$STUDY_HOURS" -gt 24 ]; then STUDY_HOURS=8; fi
              echo "== exit study (the cross, the projected-peak rule and the live-line rules, replayed on the recordings: $STUDY_HOURS h)"
              timeout $((STUDY_HOURS * 110 + 300)) nice -n 19 python3 /tmp/diag/deploy/cross_study.py ~/bot/data "$STUDY_HOURS" || echo "(exit study stopped: $?)"
              echo "== component study (the SNN and the TA network against the meta-model's price on the last 3 days of decisions; the rule book's trial rows)"
              timeout 1200 nice -n 19 python3 /tmp/diag/deploy/component_study.py ~/bot/data 3 || echo "(component study stopped: $?)"
              echo "== feed delay"; nice -n 19 python3 /tmp/diag/deploy/feed_delay.py ~/bot/data/recordings 1 || true
              echo "== latency study"; nice -n 19 python3 /tmp/diag/deploy/latency_study.py ~/bot/data/recordings 2 || true
            fi
            if [ "$TIMINGS" = "true" ] && [ -f /tmp/diag/deploy/step_timings.py ]; then
              echo "== training step timings"; nice -n 19 python3 /tmp/diag/deploy/step_timings.py ~/bot/data 30 || true
            fi
            echo "== last 60 log lines"; journalctl -u kalshi-bot -n 60 --no-pager | cut -c1-300

  # The TA contract study (the TA network review, Oct 29): does TA on the spot candles beat the fair value, and Kalshi's
  # mid, at the 15-minute contract's own question? Runs on this runner from Binance's public archives; the server is not
  # touched. The history and the replay days are cached between runs (keyed by coins and days), so a wider range only
  # builds what is new. Prints aggregates only (counts, log losses, the chosen set): this repository is public.
  ta-study:
    if: inputs.ta_study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: ta-contract-study
      cancel-in-progress: false
    env:
      TA_FROM: ${{ inputs.ta_from }}
      TA_TO: ${{ inputs.ta_to }}
      TA_ASSETS: ${{ inputs.ta_assets || 'BTC,ETH,SOL,XRP,DOGE' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restore the 1-minute history and the replay days
        uses: actions/cache@v4
        with:
          path: |
            data/history/binance-1m
            data/ta-study-replay
          key: ta-study-${{ inputs.ta_assets }}-${{ inputs.ta_from }}-${{ inputs.ta_to }}-${{ github.run_id }}
          restore-keys: |
            ta-study-${{ inputs.ta_assets }}-${{ inputs.ta_from }}-${{ inputs.ta_to }}-
            ta-study-${{ inputs.ta_assets }}-
            ta-study-
      - name: Run the study
        run: |
          set -euo pipefail
          args=(--assets "$TA_ASSETS")
          [ -n "$TA_FROM" ] && args+=(--from "$TA_FROM")
          [ -n "$TA_TO" ] && args+=(--to "$TA_TO")
          node --import tsx research/taContractStudy.ts "${args[@]}" 2>&1 | grep -vE '^\s*$' | tail -400
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ta-contract-study-report
          path: research/out/ta-contract-study/report.json
          if-no-files-found: ignore
