# Read-only health report from the Lightsail box, run manually from the Actions tab (or the API).
# Changes nothing on the server: prints the service state, load, memory, disk, the busiest processes,
# how fast the dashboard API answers, and the bot's recent log.
name: Server diagnostics

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Optional: extra read-only dashboard API paths to print, space separated (e.g. /api/snn /api/autotrain)'
        required: false
        default: ''
      pnl:
        description: 'Also run the P&L forensics report (deploy/pnl_report.py from the dispatched ref, read-only)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        if: inputs.pnl == 'true'
      - name: Upload the P&L report script
        if: inputs.pnl == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: deploy/pnl_report.py,deploy/price_study.py
          target: /tmp/diag
      - name: Report
        uses: appleboy/ssh-action@v1.0.3
        env:
          EXTRA_PATHS: ${{ inputs.paths }}
          PNL: ${{ inputs.pnl }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          command_timeout: 25m
          envs: EXTRA_PATHS,PNL
          script: |
            echo "== release: $(cat ~/bot/current/dist/RELEASE 2>/dev/null)"
            echo "== uptime / load"; uptime
            echo "== cpu over 5 s (us = bot, st = taken back by the host when burst credits run out)"; vmstat 1 5
            echo "== memory"; free -m
            echo "== disk"; df -h / | tail -1
            echo "== audit log (newest files; a day splits into parts at AUDIT_MAX_FILE_MB)"; du -sh ~/bot/data/audit 2>/dev/null; ls -la ~/bot/data/audit 2>/dev/null | tail -4
            echo "== service"; systemctl status kalshi-bot --no-pager -l | head -15
            echo "== restarts"; systemctl show kalshi-bot -p NRestarts -p ActiveEnterTimestamp -p MemoryCurrent
            echo "== top processes"; ps -eo pid,ppid,etime,pcpu,pmem,rss,args --sort=-pcpu | head -12 | cut -c1-200
            echo "== dashboard API timing"
            for p in auth status markets; do curl -s -o /dev/null -m 20 -w "/api/$p  %{http_code}  %{time_total}s\n" "http://localhost:3000/api/$p" || echo "/api/$p  no reply in 20s"; done
            echo "== trading"
            curl -s -m 20 http://localhost:3000/api/status | python3 -c 'import json,sys; s=json.load(sys.stdin); print("entries", json.dumps(s.get("entryDiagnosis"))); print("halts", s.get("haltReasons")); [print("feed", a, "index", f.get("index"), "coinbase", f.get("spot"), "binance", f.get("binance")) for a, f in (s.get("feeds") or {}).items()]; print("bankroll", s.get("bankroll"), "daily pnl", s.get("dailyPnl")); print("cpu", json.dumps((s.get("guards") or {}).get("cpu"))); print("latency", json.dumps(s.get("latency"))); k=s.get("kalshiIndexFeed") or {}; print("kalshi index feed", json.dumps({x: k.get(x) for x in ("connected","lastMessageAgoMs","received","parsed","dropped","ids","lagMs","transitMs","vendorMs","unknownTypes")})); print("kalshi index control", k.get("control")); print("kalshi index lastRaw", (k.get("lastRaw") or "")[:400]); print("kalshi index lastDropped", (k.get("lastDropped") or "")[:400]); print("market", json.dumps(s.get("market"))); print("rule book", json.dumps(s.get("ruleBook"))); print("kalshi check", json.dumps(s.get("kalshiCheck")))' || true
            curl -s -m 20 "http://localhost:3000/api/orders?limit=300" | python3 -c 'import json,sys,collections; o=json.load(sys.stdin); print("recent orders", len(o), dict(collections.Counter((x.get("purpose"), x.get("state")) for x in o))); [print("  ", x.get("ticker"), x.get("side"), x.get("count"), x.get("price"), x.get("state"), (x.get("why") or "")[:40]) for x in o[:10]]' || true
            echo "== cpu (last minute; cores: 1 = one full core; the plan sustains about 0.4) and 10-minute history"
            curl -s -m 20 http://localhost:3000/api/cpu | python3 -c 'import json,sys,time; d=json.load(sys.stdin); n=d.get("now") or {}; print("now", json.dumps({k: n.get(k) for k in ("processCores","threads","mainBusy","stealPct","iowaitPct","writeMBps","rssMb","sections")})); print("state file writes since start", json.dumps(n.get("stateWrites"))); [print("  ", time.strftime("%H:%M", time.gmtime(h["ts"]/1000)), "cores", h["cores"], "main", h["mainBusy"], "steal%", h["stealPct"], "iowait%", h["iowaitPct"], "writeMB/s", h["writeMBps"], "rssMB", h["rssMb"]) for h in (d.get("history") or [])[-18:]]' || true
            echo "== state files"; ls -la ~/bot/data/*.json 2>/dev/null | awk '{print $5, $9}' | sort -rn | head -8
            echo "== OOM / kills"; sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process" | tail -5 || true
            echo "== warnings and errors, last 3 h (counted)"
            journalctl -u kalshi-bot --since "3 hours ago" --no-pager | grep -E "ERROR|WARN|Started|Stopped|exited" | sed -E 's/^.*kalshi-bot\[[0-9]+\]: //; s/^[0-9TZ:.-]+ //; s/\{.*//' | sort | uniq -c | sort -rn | head -25
            echo "== learning and settlement report"
            if [ -f ~/bot/current/deploy/learning_report.py ]; then python3 ~/bot/current/deploy/learning_report.py ~/bot/data || true; else echo "(learning report ships with the next release)"; fi
            for p in $EXTRA_PATHS; do
              case "$p" in /api/*) ;; *) echo "skipping $p (only /api/... paths)"; continue;; esac
              echo "== GET $p"; curl -s -m 20 "http://localhost:3000$p" | head -c 6000; echo
            done
                        if [ "$PNL" = "true" ] && [ -f /tmp/diag/deploy/price_study.py ]; then echo "== price source study"; nice -n 19 python3 /tmp/diag/deploy/price_study.py ~/bot/data/recordings 1 || true; fi
            echo "== last 60 log lines"; journalctl -u kalshi-bot -n 60 --no-pager | cut -c1-300
