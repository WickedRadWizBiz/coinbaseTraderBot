# SNN ablation on demand (the SNN plan's evidence gate): replays the last DAYS recorded days with one mechanism on and
# off (research/snnAblation.ts) and prints the verdict: the paired per-settlement Brier difference with its day-block
# bootstrap 95% CI, the calibration slope, the correlation with the meta-model, the blend test and the latency band.
# Read-only on the server: it copies the recordings and the models, runs here, and copies nothing back. The copy spares
# the server's CPU (Steven, Oct 31: never burden it): no compression, lowest CPU and IO priority, 8 MB/s, and one copy at
# a time (a server-side flock: the second runner's copy waits for the first). The verdict
# file is a run artifact. This repository is public: the job prints the verdict lines and counts, never the settings.
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: SNN ablation

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Mechanisms to judge: the start of their names (e.g. mid-anchored); empty = every mechanism (hours)'
        required: false
        default: 'mid-anchored'
      domain:
        description: 'crypto (settled contracts against the meta-model) or perps (its own direction calls)'
        required: false
        default: 'crypto'
      days:
        description: 'Recorded days to replay (most recent)'
        required: false
        default: '8'
      from_run:
        description: 'Judge only: re-judge the saved sides of this earlier run id (no replay, no server read; artifacts last 7 days)'
        required: false
        default: ''
      base_from:
        description: 'Reuse the baseline side saved by this earlier run id (same mechanism, unchanged baseline): only the candidate replays, so the server is read once instead of twice'
        required: false
        default: ''
      init_from:
        description: 'history-trained: the run id whose history training saved the checkpoint the candidate starts from'
        required: false
        default: ''
      hist_from:
        description: 'History training instead of an ablation: first day (YYYY-MM-DD) of Kalshi contract history to walk the anchored crypto SNN through (research/snnHistoryTrain.ts)'
        required: false
        default: ''
      hist_to:
        description: 'History training: last day (YYYY-MM-DD)'
        required: false
        default: ''
      hist_args:
        description: 'History training: extra flags, e.g. --vol-norm 1'
        required: false
        default: ''
      hist_resume_from:
        description: 'History training: the run id whose checkpoint this run continues from'
        required: false
        default: ''
      hist_chain:
        description: 'History training: when the job time limit stops the range, start a new run that continues it (true/false)'
        required: false
        default: 'false'
      judge_args:
        description: 'Extra judge flags, e.g. --gain true --gainPrior 100 --gainForget 0.999 (the learned correction gain; --gainPerRow true weighs every row)'
        required: false
        default: '--gain true'

permissions:
  contents: read
  actions: write # history training continues itself in a new run when a range outlasts the job time limit

concurrency:
  group: snn-ablation-${{ inputs.hist_from != '' && 'history' || 'ablate' }}
  cancel-in-progress: false

jobs:
  # Every mechanism in one job (a dispatch with an empty "only"; hours).
  ablate:
    if: inputs.only == '' && inputs.from_run == '' && inputs.hist_from == ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 345
    env:
      ONLY: ${{ inputs.only }}
      DOMAIN: ${{ inputs.domain || 'crypto' }}
      DAYS: ${{ inputs.days || '8' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Recordings from the cache (only new or changed files are then read from the server)
        uses: actions/cache/restore@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
          restore-keys: snn-recordings-${{ inputs.domain || 'crypto' }}-
      - name: Copy the recordings and the meta-model (read-only)
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          [[ "$DOMAIN" =~ ^(crypto|perps)$ ]] || { echo "domain must be crypto or perps"; exit 1; }
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/models"
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          ssh bot "cd ~/bot/data/recordings && find . -type f \( ! -name 'md-*' -o -mtime -$DAYS \) -printf '%P\n'" > "$RUNNER_TEMP/recordings.txt"
          # Cached files outside today's window are dropped (the replay starts at the oldest day present).
          (cd "$DATA/recordings" && find . -type f -printf '%P\n' | sort > "$RUNNER_TEMP/have.txt"; sort "$RUNNER_TEMP/recordings.txt" | comm -23 "$RUNNER_TEMP/have.txt" - | xargs -r -d '\n' rm -f)
          echo "cache held $(wc -l < "$RUNNER_TEMP/have.txt") file(s); rsync now reads only new or changed ones"
          rsync -a --whole-file --bwlimit=8m --rsync-path="flock bot/data/locks/snn-ablation-copy.lock nice -n 19 ionice -c3 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/" || vanished_ok
          rsync -a --rsync-path="nice -n 19 ionice -c3 rsync" bot:bot/data/models/model.json "$DATA/models/" 2>/dev/null || echo "no promoted meta-model on the server: the shipped params/model.json prices"
          echo "copied $(wc -l < "$RUNNER_TEMP/recordings.txt") recording file(s); data $(du -sh "$DATA" | cut -f1)"
          # The oldest complete recorded day copied: the replay starts there.
          FROM=$(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | sed 's/^md-//' | head -1)
          [ -n "$FROM" ] || { echo "no recordings copied"; exit 1; }
          echo "FROM=$FROM" >> "$GITHUB_ENV"
          echo "replay from $FROM ($(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | wc -l) day(s))"
      - name: Save the recordings to the cache
        if: matrix.side != 'baseline'
        uses: actions/cache/save@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
      - name: Ablation
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p research/out
          MODEL=""; [ "$DOMAIN" = crypto ] && [ -f "$DATA/models/model.json" ] && MODEL="--model $DATA/models/model.json"
          # The verdict lines (ACCEPT / reject, dBrier with its CI, slope, correlation, blend, latency) and the file.
          npm run --silent research:snn-ablation -- --recordings "$DATA/recordings" --domain "$DOMAIN" --from "${FROM}T00:00:00Z" --only "$ONLY" --out research/out/snn_ablation.json $MODEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snn-ablation-${{ inputs.domain || 'crypto' }}
          path: research/out/snn_ablation.json
          if-no-files-found: ignore

  # One mechanism: its baseline and candidate replay on two runners at once (each ~2-3 h), then one judge.
  quote-lag:
    if: inputs.only == 'quote-lag' && inputs.hist_from == ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 345
    env:
      ONLY: ${{ inputs.only }}
      DOMAIN: ${{ inputs.domain || 'crypto' }}
      DAYS: ${{ inputs.days || '8' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Recordings from the cache (only new or changed files are then read from the server)
        uses: actions/cache/restore@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
          restore-keys: snn-recordings-${{ inputs.domain || 'crypto' }}-
      - name: Copy the recordings and the meta-model (read-only)
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          [[ "$DOMAIN" =~ ^(crypto|perps)$ ]] || { echo "domain must be crypto or perps"; exit 1; }
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/models"
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          ssh bot "cd ~/bot/data/recordings && find . -type f \( ! -name 'md-*' -o -mtime -$DAYS \) -printf '%P\n'" > "$RUNNER_TEMP/recordings.txt"
          # Cached files outside today's window are dropped (the replay starts at the oldest day present).
          (cd "$DATA/recordings" && find . -type f -printf '%P\n' | sort > "$RUNNER_TEMP/have.txt"; sort "$RUNNER_TEMP/recordings.txt" | comm -23 "$RUNNER_TEMP/have.txt" - | xargs -r -d '\n' rm -f)
          echo "cache held $(wc -l < "$RUNNER_TEMP/have.txt") file(s); rsync now reads only new or changed ones"
          rsync -a --whole-file --bwlimit=8m --rsync-path="flock bot/data/locks/snn-ablation-copy.lock nice -n 19 ionice -c3 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/" || vanished_ok
          rsync -a --rsync-path="nice -n 19 ionice -c3 rsync" bot:bot/data/models/model.json "$DATA/models/" 2>/dev/null || echo "no promoted meta-model on the server: the shipped params/model.json prices"
          echo "copied $(wc -l < "$RUNNER_TEMP/recordings.txt") recording file(s); data $(du -sh "$DATA" | cut -f1)"
          # The oldest complete recorded day copied: the replay starts there.
          FROM=$(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | sed 's/^md-//' | head -1)
          [ -n "$FROM" ] || { echo "no recordings copied"; exit 1; }
          echo "FROM=$FROM" >> "$GITHUB_ENV"
          echo "replay from $FROM ($(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | wc -l) day(s))"
      - name: Save the recordings to the cache
        if: matrix.side != 'baseline'
        uses: actions/cache/save@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
      - name: Quote lag study
        run: |
          set -euo pipefail
          mkdir -p research/out
          export TRADING_MODE=paper AUTO_TRAIN=off
          # Does the mid follow the coin's move a few seconds late, and does trading that pay after taker fees?
          npm run --silent research:quote-lag -- --recordings "$GITHUB_WORKSPACE/data/recordings" --count 20 --out research/out/quote_lag.json 2>&1 | grep --line-buffered -E '^\[quote-lag\]|Error|FATAL'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-lag
          path: research/out/quote_lag.json
          if-no-files-found: ignore

  side:
    if: inputs.only != '' && inputs.only != 'quote-lag' && inputs.from_run == '' && inputs.hist_from == ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(inputs.base_from != '' && '["candidate"]' || '["baseline","candidate"]') }}
    env:
      ONLY: ${{ inputs.only }}
      DOMAIN: ${{ inputs.domain || 'crypto' }}
      DAYS: ${{ inputs.days || '8' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Recordings from the cache (only new or changed files are then read from the server)
        uses: actions/cache/restore@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
          restore-keys: snn-recordings-${{ inputs.domain || 'crypto' }}-
      - name: Copy the recordings and the meta-model (read-only)
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          [[ "$DOMAIN" =~ ^(crypto|perps)$ ]] || { echo "domain must be crypto or perps"; exit 1; }
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/models"
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          ssh bot "cd ~/bot/data/recordings && find . -type f \( ! -name 'md-*' -o -mtime -$DAYS \) -printf '%P\n'" > "$RUNNER_TEMP/recordings.txt"
          # Cached files outside today's window are dropped (the replay starts at the oldest day present).
          (cd "$DATA/recordings" && find . -type f -printf '%P\n' | sort > "$RUNNER_TEMP/have.txt"; sort "$RUNNER_TEMP/recordings.txt" | comm -23 "$RUNNER_TEMP/have.txt" - | xargs -r -d '\n' rm -f)
          echo "cache held $(wc -l < "$RUNNER_TEMP/have.txt") file(s); rsync now reads only new or changed ones"
          rsync -a --whole-file --bwlimit=8m --rsync-path="flock bot/data/locks/snn-ablation-copy.lock nice -n 19 ionice -c3 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/" || vanished_ok
          rsync -a --rsync-path="nice -n 19 ionice -c3 rsync" bot:bot/data/models/model.json "$DATA/models/" 2>/dev/null || echo "no promoted meta-model on the server: the shipped params/model.json prices"
          echo "copied $(wc -l < "$RUNNER_TEMP/recordings.txt") recording file(s); data $(du -sh "$DATA" | cut -f1)"
          # The oldest complete recorded day copied: the replay starts there.
          FROM=$(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | sed 's/^md-//' | head -1)
          [ -n "$FROM" ] || { echo "no recordings copied"; exit 1; }
          echo "FROM=$FROM" >> "$GITHUB_ENV"
          echo "replay from $FROM ($(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | wc -l) day(s))"
      - name: Save the recordings to the cache
        if: matrix.side != 'baseline'
        uses: actions/cache/save@v4
        with:
          path: data/recordings
          key: snn-recordings-${{ inputs.domain || 'crypto' }}-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        # history-trained: the candidate starts from the network a history-training run saved.
        if: inputs.init_from != '' && matrix.side == 'candidate'
        with:
          name: snn-history-checkpoint
          path: research/out/init
          run-id: ${{ inputs.init_from }}
          github-token: ${{ github.token }}
      - name: Replay one side
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p research/out
          MODEL=""; [ "$DOMAIN" = crypto ] && [ -f "$DATA/models/model.json" ] && MODEL="--model $DATA/models/model.json"
          INIT=""; [ -f research/out/init/snn-history-checkpoint.json ] && INIT="--init research/out/init/snn-history-checkpoint.json"
          npm run --silent research:snn-ablation -- --recordings "$DATA/recordings" --domain "$DOMAIN" --from "${FROM}T00:00:00Z" --only "$ONLY" --side ${{ matrix.side }} --save research/out/side-${{ matrix.side }}.json $MODEL $INIT
      - uses: actions/upload-artifact@v4
        with:
          name: snn-ablation-side-${{ matrix.side }}
          path: research/out/side-${{ matrix.side }}.json
          retention-days: 7

  judge:
    needs: side
    if: always() && inputs.hist_from == '' && (needs.side.result == 'success' || inputs.from_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONLY: ${{ inputs.only }}
      DOMAIN: ${{ inputs.domain || 'crypto' }}
      DAYS: ${{ inputs.days || '8' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - uses: actions/download-artifact@v4
        with:
          pattern: snn-ablation-side-*
          path: research/out
          merge-multiple: true
          # Judge-only: the sides saved by an earlier run.
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ inputs.from_run != '' && github.token || '' }}
      - uses: actions/download-artifact@v4
        # The baseline side saved by an earlier run (base_from): no second replay, no second server read.
        if: inputs.base_from != '' && inputs.from_run == ''
        with:
          name: snn-ablation-side-baseline
          path: research/out
          run-id: ${{ inputs.base_from }}
          github-token: ${{ github.token }}
      - name: Judge
        env:
          JUDGE_ARGS: ${{ inputs.judge_args }}
        run: |
          set -euo pipefail
          # The verdict line, the "vs market" line (the SNN plan's phase 1 go/no-go) and where the SNN stands against
          # the market by asset x horizon, mid level, hour, kind and volatility.
          npm run --silent research:snn-ablation -- --domain "$DOMAIN" --only "$ONLY" --judge research/out/side-baseline.json,research/out/side-candidate.json --breakdown true $(printf '%s' "$JUDGE_ARGS" | tr -cd 'a-zA-Z0-9 .-') --out research/out/snn_ablation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snn-ablation-${{ inputs.domain || 'crypto' }}
          path: research/out/snn_ablation.json
          if-no-files-found: ignore

  # History training (Steven, Oct 31: make the SNNs learn, fast): one anchored crypto network walks Kalshi's settled
  # contracts month by month and prints how it priced each month against the market before learning it. From the
  # server only Kalshi's day files for the range, once (throttled, the same lock as the recordings copy), then kept in
  # the Actions cache so a rerun reads nothing from the server. Spot history comes from data.binance.vision.
  history-train:
    if: inputs.hist_from != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      HFROM: ${{ inputs.hist_from }}
      HTO: ${{ inputs.hist_to }}
      HARGS: ${{ inputs.hist_args }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: Check the range
        run: |
          [[ "$HFROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$HTO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "hist_from / hist_to must be YYYY-MM-DD"; exit 1; }
      - name: Kalshi history from the cache
        id: khist
        uses: actions/cache/restore@v4
        if: "!contains(inputs.hist_args, 'synthetic')"
        with:
          path: ${{ runner.temp }}/hist/history/kalshi
          key: kalshi-history-${{ inputs.hist_from }}-${{ inputs.hist_to }}
      - name: SSH to the server
        if: steps.khist.outputs.cache-hit != 'true' && !contains(inputs.hist_args, 'synthetic')
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy Kalshi's day files for the range (read-only, throttled, one copy at a time)
        if: steps.khist.outputs.cache-hit != 'true' && !contains(inputs.hist_args, 'synthetic')
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/hist/history/kalshi"; mkdir -p "$K"
          # The range's day files and the day after each (contracts past midnight); crypto series only (no tennis tapes).
          python3 -c 'import sys,datetime as d; a=d.date.fromisoformat(sys.argv[1]); b=d.date.fromisoformat(sys.argv[2]); n=(b-a).days+3; [print("/KX*/%s.jsonl" % (a+d.timedelta(days=i-1)).isoformat()) for i in range(n)]' "$HFROM" "$HTO" > "$RUNNER_TEMP/kdays.txt"
          rsync -a --whole-file --bwlimit=8m --rsync-path="flock bot/data/locks/snn-ablation-copy.lock nice -n 19 ionice -c3 rsync" --include='/KX*/' --include-from="$RUNNER_TEMP/kdays.txt" --exclude='*' --prune-empty-dirs bot:bot/data/history/kalshi/ "$K/"
          echo "Kalshi day files: $(find "$K" -type f | wc -l) in $(ls "$K" | wc -l) series, $(du -sh "$K" | cut -f1)"
      - name: Save the Kalshi history to the cache (right away, so a cancelled training still keeps it)
        if: steps.khist.outputs.cache-hit != 'true' && !contains(inputs.hist_args, 'synthetic')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hist/history/kalshi
          key: kalshi-history-${{ inputs.hist_from }}-${{ inputs.hist_to }}
      - uses: actions/download-artifact@v4
        # Continue an earlier history training from its checkpoint (it resumes the day after the checkpoint's last one).
        if: inputs.hist_resume_from != ''
        with:
          name: snn-history-checkpoint
          path: research/out/prev
          run-id: ${{ inputs.hist_resume_from }}
          github-token: ${{ github.token }}
      - name: Train
        id: train
        timeout-minutes: 330
        run: |
          set -euo pipefail
          mkdir -p research/out
          export TRADING_MODE=paper AUTO_TRAIN=off NODE_OPTIONS="--max-old-space-size=6144"
          EXTRA=$(printf '%s' "$HARGS" | tr -cd 'a-zA-Z0-9 .-')
          PREV=""; [ -f research/out/prev/snn-history-checkpoint.json ] && PREV="--checkpoint-in research/out/prev/snn-history-checkpoint.json"
          node --import tsx research/snnHistoryTrain.ts --from "$HFROM" --to "$HTO" --history "$RUNNER_TEMP/hist/history" --work "$RUNNER_TEMP/hist" --minutes 285 --checkpoint-out research/out/snn-history-checkpoint.json $PREV $EXTRA 2>&1 | grep --line-buffered -E '^\[hist-train\]|failed|FATAL|heap' | stdbuf -oL cut -c1-260 | tee research/out/hist-train.log
          if grep -q 'time is up' research/out/hist-train.log; then echo "more=true" >> "$GITHUB_OUTPUT"; else echo "more=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snn-history-checkpoint
          path: research/out/snn-history-checkpoint.json
          if-no-files-found: ignore
      - name: Continue the range in a new run (the job time limit stopped this one)
        if: steps.train.outputs.more == 'true' && inputs.hist_chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snn-ablation.yml --ref "$GITHUB_REF_NAME" -f hist_from="$HFROM" -f hist_to="$HTO" -f hist_args="$HARGS" -f hist_resume_from="${{ github.run_id }}" -f hist_chain=true
