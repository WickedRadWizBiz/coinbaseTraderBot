# SNN ablation on demand (the SNN plan's evidence gate): replays the last DAYS recorded days with one mechanism on and
# off (research/snnAblation.ts) and prints the verdict: the paired per-settlement Brier difference with its day-block
# bootstrap 95% CI, the calibration slope, the correlation with the meta-model, the blend test and the latency band.
# Read-only on the server: it copies the recordings and the models, runs here, and copies nothing back. The verdict
# file is a run artifact. This repository is public: the job prints the verdict lines and counts, never the settings.
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: SNN ablation

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Mechanisms to judge: the start of their names (e.g. mid-anchored); empty = every mechanism (hours)'
        required: false
        default: 'mid-anchored'
      domain:
        description: 'crypto (settled contracts against the meta-model) or perps (its own direction calls)'
        required: false
        default: 'crypto'
      days:
        description: 'Recorded days to replay (most recent)'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: snn-ablation
  cancel-in-progress: false

jobs:
  ablate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 345
    env:
      ONLY: ${{ inputs.only || '' }}
      DOMAIN: ${{ inputs.domain || 'crypto' }}
      DAYS: ${{ inputs.days || '10' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the recordings and the meta-model (read-only)
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          [[ "$DOMAIN" =~ ^(crypto|perps)$ ]] || { echo "domain must be crypto or perps"; exit 1; }
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/models"
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          ssh bot "cd ~/bot/data/recordings && find . -type f \( ! -name 'md-*' -o -mtime -$DAYS \) -printf '%P\n'" > "$RUNNER_TEMP/recordings.txt"
          rsync -a -z --compress-level=1 --rsync-path="nice -n 19 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/" || vanished_ok
          rsync -a --rsync-path="nice -n 19 rsync" bot:bot/data/models/model.json "$DATA/models/" 2>/dev/null || echo "no promoted meta-model on the server: the shipped params/model.json prices"
          echo "copied $(wc -l < "$RUNNER_TEMP/recordings.txt") recording file(s); data $(du -sh "$DATA" | cut -f1)"
          # The oldest complete recorded day copied: the replay starts there.
          FROM=$(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | sed 's/^md-//' | head -1)
          [ -n "$FROM" ] || { echo "no recordings copied"; exit 1; }
          echo "FROM=$FROM" >> "$GITHUB_ENV"
          echo "replay from $FROM ($(ls "$DATA/recordings" | grep -oE 'md-[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | wc -l) day(s))"
      - name: Ablation
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p research/out
          MODEL=""; [ "$DOMAIN" = crypto ] && [ -f "$DATA/models/model.json" ] && MODEL="--model $DATA/models/model.json"
          # The verdict lines (ACCEPT / reject, dBrier with its CI, slope, correlation, blend, latency) and the file.
          npm run --silent research:snn-ablation -- --recordings "$DATA/recordings" --domain "$DOMAIN" --from "${FROM}T00:00:00Z" --only "$ONLY" --out research/out/snn_ablation.json $MODEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snn-ablation-${{ inputs.domain || 'crypto' }}
          path: research/out/snn_ablation.json
          if-no-files-found: ignore
