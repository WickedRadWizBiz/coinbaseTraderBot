name: Scaling history lab

# The scaling lab's arms (dynamic edge, regime sizing) replayed as the whole paper bot over months of Kalshi history,
# paired day by day against today's bot (research/scalingHistory.ts; thread "Plan dynamic scaling across the bot", Nov 1).
# Steven's rule (Nov 1): history research must be deep on days and cover several market regimes, so the report splits the
# days by month and into calm / normal / wild BTC days. Reads the daily sweep's caches from main (the Kalshi history and
# its replay, and the server's model and settings it copied): the server is not touched. Aggregates only (public repo);
# the report is posted as a comment on the commit. Arms: lab/scaling-history.txt (tag: KEY=VALUE ..., header # days=N).

on:
  push:
    branches: ['claude/project-thread-ks5pyx', 'claude/project-thread-0pkw7f']
    paths: ['lab/scaling-history.txt']

permissions:
  contents: write
  actions: read

concurrency:
  group: scaling-history-${{ github.sha }}
  cancel-in-progress: false

env:
  SWEEP_BANKROLL_USD: '200'

jobs:
  data:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    outputs:
      arms: ${{ steps.p.outputs.arms }}
      days: ${{ steps.p.outputs.days }}
      replay_key: ${{ steps.keys.outputs.replay }}
      server_key: ${{ steps.keys.outputs.server }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          days, arms, copy = '120', [], '0'
          for line in open('lab/scaling-history.txt'):
              line = line.rstrip('\n')
              m = re.match(r'^#\s*days=([0-9]+)$', line)
              if m: days = m.group(1); continue
              if re.match(r'^#\s*server_copy=1$', line): copy = '1'; continue
              if not line.strip() or line.lstrip().startswith('#'): continue
              tag, _, ov = line.partition(':')
              assert re.match(r'^[a-z0-9_]+$', tag.strip()), tag
              for kv in ov.split():
                  assert re.match(r'^[A-Z][A-Z0-9_]*=[A-Za-z0-9_.,:-]*$', kv), kv
              arms.append({'tag': tag.strip(), 'overrides': ' '.join(ov.split())})
          assert arms and arms[0]['tag'] == 'base' and len(arms) <= 16
          print('days=' + days); print('copy=' + copy); print('arms=' + json.dumps(arms))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      # Lean caches (the repo's 10 GB limit evicts other threads' copies): a sweep copy of the history on main from the last
      # day is used as it is, by its own key, with no second copy; only a history built or updated here is saved.
      - name: Restore the Kalshi history and its replay (the sweep's on main, else this branch's)
        id: hist
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: scaling-history-replay-${{ github.run_id }}
          restore-keys: |
            kalshi-replay-
            scaling-history-replay-
      - name: Is the restored history fresh (a copy saved in the last 30 h)?
        id: fresh
        env:
          K: ${{ steps.hist.outputs.cache-matched-key }}
        run: |
          f=$(find data/history-replay -type f -mmin -1800 2>/dev/null | head -1)
          if [ -n "$K" ] && [ -n "$f" ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; echo "using $K as it is"; else echo "fresh=0" >> "$GITHUB_OUTPUT"; fi
      - name: Repair stored quotes, download what is new, rebuild the replay
        if: steps.fresh.outputs.fresh != '1'
        run: |
          node --import tsx research/kalshiReplayData.ts --history data/history --out data/history-replay --days "$(( ${{ steps.p.outputs.days }} + 3 ))" --budget-min 100 2>&1 \
            | grep -vE '^\[kalshi-replay-data\] (binance|kalshi|replay): .*(skipp|already|listing|page)' | tail -30
      - name: Save the Kalshi history and its replay
        if: always() && steps.fresh.outputs.fresh != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            data/history
            data/history-replay
          key: scaling-history-replay-${{ github.run_id }}
      - name: Restore the server's model and settings (the sweep's copy on main)
        id: srv
        uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: kalshi-server-none
          restore-keys: kalshi-server-
      # Only with the header line '# server_copy=1' (the coordinator's copy slot) and no sweep copy on main: the same small,
      # read-only copy the sweep makes (the model files and the settings without credentials), throttled. No recordings.
      - name: Copy the server's model and settings (read-only, opt-in)
        if: steps.p.outputs.copy == '1' && hashFiles('data/models/model.json') == ''
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/models" "$DATA/sweep-env"
          R=(rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync")
          "${R[@]}" bot:bot/data/models/model.json "$DATA/models/"
          for f in vol_profile.json vol_model.json fill_model.json session_risk.json ta_net.json rule_book.json gp_indicators.json; do "${R[@]}" "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || true; done
          "${R[@]}" bot:bot/data/probation.json "$DATA/sweep-env/probation.json" 2>/dev/null || true
          "${R[@]}" bot:bot/data/component_trials.json "$DATA/sweep-env/component_trials.json" 2>/dev/null || true
          ssh bot "grep -E '^[A-Z][A-Z0-9_]*=' ~/bot/bot.env" | grep -vE 'KEY|SECRET|TOKEN|PASSWORD|PRIVATE|PEM|CREDENTIAL|^BIND_HOST=|^ALLOW_NON_LOOPBACK|^PORT=' | grep -vE '^[A-Z0-9_]+=["'"'"']?(/|~)' > "$DATA/sweep-env/train.env" || true
          rm -f ~/.ssh/id_bot
          echo "settings: $(wc -l < "$DATA/sweep-env/train.env") line(s); model: $(ls "$DATA/models" | wc -l) file(s)"
      - name: Stop when no copy of the server's model is cached
        run: '[ -f data/models/model.json ] || { echo "::error::no server copy cached: rerun after the daily sweep"; exit 1; }'
      # One copy of the model and settings for every arm (a newer sweep copy mid-run would compare different models).
      - name: Pin that copy for every replay of this run (only when copied here; a sweep copy is pinned by its own key)
        if: steps.srv.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: scaling-history-server-${{ github.run_id }}
      - id: keys
        env:
          FRESH: ${{ steps.fresh.outputs.fresh }}
          HK: ${{ steps.hist.outputs.cache-matched-key }}
          SK: ${{ steps.srv.outputs.cache-matched-key }}
        run: |
          if [ "$FRESH" = 1 ]; then echo "replay=$HK"; else echo "replay=scaling-history-replay-${{ github.run_id }}"; fi >> "$GITHUB_OUTPUT"
          if [ -n "$SK" ]; then echo "server=$SK"; else echo "server=scaling-history-server-${{ github.run_id }}"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" | grep -E '^(replay|server)='

  run:
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # One long replay at a time: the account's runner cap is shared with every thread (coordinator, Nov 1).
      max-parallel: 1
      matrix:
        arm: ${{ fromJson(needs.data.outputs.arms) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: ${{ needs.data.outputs.replay_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: ${{ needs.data.outputs.server_key }}
          fail-on-cache-miss: true
      - name: Replay ${{ matrix.arm.tag }}
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          OVERRIDES: ${{ matrix.arm.overrides }}
          TAG: ${{ matrix.arm.tag }}
        run: |
          node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "${{ needs.data.outputs.days }}"
          if [ -f data/sweep-env/train.env ]; then set -a; . data/sweep-env/train.env; set +a; echo "server settings: $(wc -l < data/sweep-env/train.env) line(s)"; else echo "no server settings cached: the bot's defaults"; fi
          cp -rn data/sweep-env/history/. data/history/ 2>/dev/null || true
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper RS_PROBATION_FILE="$GITHUB_WORKSPACE/data/sweep-env/probation.json" RS_TRIALS_FILE="$GITHUB_WORKSPACE/data/sweep-env/component_trials.json"
          node --import tsx research/scalingHistory.ts run --arm "$TAG" --env "$OVERRIDES" --days data/sweep-days --model data/models/model.json --out research/out/scaling-history 2>&1 \
            | grep -E '^\[scaling-history\]|Error|error' | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-history-${{ matrix.arm.tag }}
          path: research/out/scaling-history/
          retention-days: 14

  report:
    needs: [data, run]
    if: ${{ !cancelled() && needs.data.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: ${{ needs.data.outputs.replay_key }}
      - uses: actions/download-artifact@v4
        with:
          pattern: scaling-history-*
          path: research/out/scaling-history
          merge-multiple: true
      - name: Report and post it on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --import tsx research/scalingHistory.ts report --out research/out/scaling-history --candles data/history/binance/BTC/1d.csv --last "${{ needs.data.outputs.days }}" > report.txt 2>&1 || true
          cat report.txt
          { echo "**Scaling history lab** run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"; echo; echo '```'; head -c 60000 report.txt; echo '```'; } > comment.md
          jq -n --rawfile body comment.md '{body: $body}' | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - --jq '.html_url'
