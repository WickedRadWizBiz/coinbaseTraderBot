# How true to life the history replay's Kalshi quotes are (research/replayFidelity.ts; Steven, Oct 28). The newest whole
# recorded days are cut down to Kalshi's minute candles, filled back in each way the go-live tally can play a history
# day, and the decision model's backtest on each is compared with its backtest on the real quotes. The closest fill-in
# goes to the server as models/replay_fidelity.json, which the daily training's tally_history step reads.
#
# The five backtests (the real quotes and each fill-in) run on runners of their own: one after another they outlast a
# job's time limit. Each fill-in's runner rebuilds the fill-ins itself (no recordings leave the server's and runners'
# disks); only the per-window P&L goes between jobs, for a day.
#
# Read-only on the server except that one file. This repository is public: the job prints the fill-ins' names, $ figures
# and counts, never the settings file, keys or logs.
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Replay fidelity

on:
  # No fixed schedule (Oct 31): only one copy may come off the server at a time, so each run is dispatched when the
  # copy slot is free, about every other day (Steven, Oct 29: the depth simulator must keep passing on fresh days).
  workflow_dispatch:
    inputs:
      days:
        description: 'Whole recorded days compared (the newest; the day before them is read for the contracts still open at midnight)'
        required: false
        default: '4'
      fit_days:
        description: 'Older recorded days the depth fill-in is fitted on (never the compared ones)'
        required: false
        default: '3'
      reuse_run:
        description: 'Replay the days an earlier run copied (its run id; its cache is kept 7 days unused): no server copy at all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: replay-fidelity
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    outputs:
      files: ${{ steps.pick.outputs.files }}
      fit: ${{ steps.pick.outputs.fit }}
      key: ${{ steps.pick.outputs.key }}
    env:
      DAYS: ${{ inputs.days || '4' }}
      FIT_DAYS: ${{ inputs.fit_days || '3' }}
    steps:
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: The earlier run's days (reuse_run)
        if: inputs.reuse_run != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/recordings
            data/fit
            data/models
          key: fidelity-data-${{ inputs.reuse_run }}-1
          fail-on-cache-miss: true
      - name: Pick the days
        id: pick
        env:
          REUSE: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          if [ -n "$REUSE" ]; then
            [[ "$REUSE" =~ ^[0-9]+$ ]] || { echo "reuse_run must be a run id"; exit 1; }
            echo "files=$(ls -1 data/recordings | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "fit=$(ls -1 data/fit | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "key=fidelity-data-$REUSE-1" >> "$GITHUB_OUTPUT"
            echo "days of run $REUSE: $(ls -1 data/recordings | tr '\n' ' ')"
            exit 0
          fi
          echo "key=fidelity-data-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          [[ "$DAYS" =~ ^[0-9]+$ ]] && [ "$DAYS" -ge 2 ] || { echo "days must be a whole number of at least 2"; exit 1; }
          # The newest DAYS whole days and the day before them (today's is still being recorded), the same on every runner.
          TODAY=$(date -u +%F)
          ALL=$(ssh bot "cd ~/bot/data/recordings && ls -1 md-*.jsonl*" | sort | awk -v t="md-$TODAY" '$0 < t')
          FILES=$(echo "$ALL" | tail -n $((DAYS + 1)) | tr '\n' ' ')
          # The depth fill-in's model is fitted on the days before those (the warm-up day included in neither).
          FIT=$(echo "$ALL" | head -n -$((DAYS + 1)) | tail -n "$FIT_DAYS" | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "fit=$FIT" >> "$GITHUB_OUTPUT"
          echo "days: $FILES | depth fitted on: $FIT"
      - name: Copy the days and the models once, capped at 8 MB/s (read-only, so the server is never burdened)
        if: inputs.reuse_run == ''
        env:
          FILES: ${{ steps.pick.outputs.files }}
          FIT: ${{ steps.pick.outputs.fit }}
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/fit" "$DATA/models"
          printf '%s\n' $FILES > "$RUNNER_TEMP/recordings.txt"
          rsync -a --bwlimit=8000 --rsync-path="nice -n 19 ionice -c3 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/"
          if [ -n "$FIT" ]; then
            printf '%s\n' $FIT > "$RUNNER_TEMP/fit.txt"
            rsync -a --bwlimit=8000 --rsync-path="nice -n 19 ionice -c3 rsync" --files-from="$RUNNER_TEMP/fit.txt" bot:bot/data/recordings/ "$DATA/fit/"
          fi
          for f in model.json vol_model.json fill_model.json; do rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" "bot:bot/data/models/$f" "$DATA/models/" 2>/dev/null || echo "$f: not on the server"; done
          [ -f "$DATA/models/model.json" ] || { echo "no decision model on the server yet"; exit 1; }
          echo "copied $(ls "$DATA/recordings" | wc -l) recording file(s), $(ls "$DATA/fit" | wc -l) fit day(s), $(du -sm "$DATA" | cut -f1) MB"
      # Shared with this run's backtest runners through the Actions cache (never an artifact: no recordings leave the
      # server's and runners' disks), so the server is read once a run instead of once a runner.
      - uses: actions/cache/save@v4
        if: inputs.reuse_run == ''
        with:
          path: |
            data/recordings
            data/fit
            data/models
          key: fidelity-data-${{ github.run_id }}-${{ github.run_attempt }}

  backtest:
    needs: pick
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # Eight runners, not 24: queued behind the other labs, 24 waited so long that the cached copy of the days was
        # evicted before most of them started (run 41218659211). The real quotes and the four quick fill-ins run one
        # after another on one runner (about 25-45 minutes each); the depth fill-in (about 1.5 hours) on its own.
        group: [fills, depth]
        # The days split into four runs of one day, each backtested on a runner of its own from the day before it
        # (two days of the depth fill-in took 4.5 hours or more, near the time limit).
        part: [0, 1, 2, 3]
    env:
      DAYS: ${{ inputs.days || '4' }}
      PARTS: 4
      FILES: ${{ needs.pick.outputs.files }}
      FIT: ${{ needs.pick.outputs.fit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/recordings
            data/fit
            data/models
          key: ${{ needs.pick.outputs.key }}
          fail-on-cache-miss: true
      - name: The settings (read-only)
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings" "$DATA/models"
          printf '%s\n' $FILES > "$RUNNER_TEMP/recordings.txt"
          # The days and the models come from the pick job's single copy (the cache above): nothing more is copied here.
          [ -f "$DATA/models/model.json" ] || { echo "no decision model in the copy"; exit 1; }
          echo "restored $(ls "$DATA/recordings" | wc -l) recording file(s)"
          # The server's settings without any credential, and without server paths (as Remote training copies them).
          ssh bot "grep -E '^[A-Z][A-Z0-9_]*=' ~/bot/bot.env" | grep -vE 'KEY|SECRET|TOKEN|PASSWORD|PRIVATE|PEM|CREDENTIAL|^BIND_HOST=|^ALLOW_NON_LOOPBACK|^PORT=' | grep -vE '^[A-Z0-9_]+=["'"'"']?(/|~)' > "$RUNNER_TEMP/train.env" || true
      - name: Backtest (${{ matrix.group }})
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; WORK="$DATA/fidelity"
          set -a; . "$RUNNER_TEMP/train.env"; set +a
          export DATA_DIR="$DATA" TRADING_MODE=paper AUTO_TRAIN=off NODE_OPTIONS="--max-old-space-size=12288"
          run() {
            if ! node --import tsx research/replayFidelity.ts --recordings "$DATA/recordings" --model "$DATA/models/model.json" --days "$DAYS" --work "$WORK" --parts "$PARTS" --part "${{ matrix.part }}" "$@" 2>&1 | tee -a "$RUNNER_TEMP/fidelity.log" | { grep --line-buffered '^\[fidelity\]' || true; }; then
              tail -5 "$RUNNER_TEMP/fidelity.log" | cut -c1-200; exit 1
            fi
          }
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ matrix.group }}" = depth ]; then
            [ -n "$FIT" ] && [ -n "$(ls -A "$DATA/fit" 2>/dev/null)" ] || { echo "no older recorded days to fit the depth model on"; exit 1; }
            node --import tsx research/depthStudy.ts --recordings "$DATA/fit" --out "$DATA/models/depth_model.json" 2>&1 | grep -E '^\[depth\] [0-9]' || true
            [ -s "$DATA/models/depth_model.json" ] || { echo "the depth study wrote no model"; exit 1; }
            run --stage prepare --only depth --depth-model "$DATA/models/depth_model.json"
            run --stage backtest --how depth
            cp "$WORK"/windows-depth-p*.json "$DATA/models/depth_model.json" "$RUNNER_TEMP/out/"
          else
            # One failed fill-in leaves the others standing (compare leaves it out); the real quotes are needed.
            run --stage backtest --how real
            cp "$WORK"/windows-real-p*.json "$RUNNER_TEMP/out/"
            for how in hold requote worst noise; do
              if ( run --stage prepare --only "$how" && run --stage backtest --how "$how" ); then
                cp "$WORK"/windows-$how-p*.json "$RUNNER_TEMP/out/"
              else
                echo "::warning::the $how fill-in failed: left out of the comparison"
              fi
            done
          fi
          if [ -f "$WORK/meta.json" ]; then cp "$WORK/meta.json" "$RUNNER_TEMP/out/meta-p${{ matrix.part }}.json"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: fidelity-${{ matrix.group }}-p${{ matrix.part }}
          path: ${{ runner.temp }}/out/
          retention-days: 1

  compare:
    needs: backtest
    # A fill-in whose job failed is left out of the comparison (the real backtest is still needed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - uses: actions/download-artifact@v4
        with:
          pattern: fidelity-*
          path: ${{ runner.temp }}/in
      - name: Compare the fill-ins with the real quotes
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/data/fidelity"; OUT="$GITHUB_WORKSPACE/data/models/replay_fidelity.json"
          mkdir -p "$WORK"
          cp "$RUNNER_TEMP"/in/fidelity-*/windows-*.json "$WORK/"
          cp "$RUNNER_TEMP"/in/fidelity-fills-p*/meta-p*.json "$WORK/"
          export TRADING_MODE=paper AUTO_TRAIN=off
          node --import tsx research/replayFidelity.ts --stage compare --work "$WORK" --model model.json --out "$OUT" > "$RUNNER_TEMP/fidelity.log" 2>&1 || { tail -5 "$RUNNER_TEMP/fidelity.log" | cut -c1-200; exit 1; }
          python3 - "$OUT" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print('days:', ', '.join(r['days']), '| real quotes:', r['real']['windowsTraded'], 'windows traded, P&L $', r['real']['pnl'])
          for v in r['variants']:
              print(f"  {v['how']:8s} P&L ${v['pnl']:>9}  traded {v['windowsTraded']:>4}  off by ${v['biasUsd']:>9}  per-window error ${v['rmseUsd']}  correlation {v['corr']}")
          c = r['choice']
          print('closest to the real quotes:', c['how'] + (f" (bridge {c['sigma']})" if c.get('sigma') else ''))
          PY
      - name: Send the verdict to the server
        run: |
          set -euo pipefail
          # A depth verdict needs its model next to it (the tally falls back to the worst side without one).
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["choice"]["how"] == "depth" else 1)' "$GITHUB_WORKSPACE/data/models/replay_fidelity.json"; then
            rsync -a --bwlimit=8000 --whole-file --rsync-path="nice -n 19 rsync" "$RUNNER_TEMP/in/fidelity-depth-p0/depth_model.json" bot:bot/data/models/
          fi
          rsync -a --bwlimit=8000 --whole-file --rsync-path="nice -n 19 rsync" "$GITHUB_WORKSPACE/data/models/replay_fidelity.json" bot:bot/data/models/ && echo "verdict copied; the next training run plays history with it"
